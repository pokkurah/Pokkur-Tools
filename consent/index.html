<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- スタッフの発行画面だけ院内パスコードで守る。飼い主がリンク（#d=）で開いたときは gate.js を読み込まない -->
<script>if(!/[#&]d=/.test(location.hash))document.write('<script src="../gate.js"><\/script>')</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>同意書｜ポックル動物病院</title>
<style>
:root{--g:#0F6E56;--gl:#E7F3EF;--bg:#fff;--line:#cfd6d3;--tx:#1a1a1a;--mut:#5b6562;--red:#b3261e;--fs:22px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP","Noto Sans CJK JP",sans-serif;font-size:var(--fs);line-height:1.8}
body.xl{--fs:26px}
@media(min-width:700px){:root{--fs:24px}body.xl{--fs:29px}}
.wrap{max-width:600px;margin:0 auto;padding:0 20px 150px}
h1{font-size:1.18em;line-height:1.5;margin:.9em 0 .4em}
.test{background:#fff3cd;border:1px solid #e0c36a;border-radius:8px;padding:6px 10px;font-size:14px;line-height:1.5;margin:8px 0}
/* 上の帯 */
.top{position:sticky;top:0;background:#fff;z-index:5;margin:0 -20px;padding:8px 20px 0}
.top .r{display:flex;align-items:center;gap:8px;min-height:48px}
.top .back{font:inherit;font-size:17px;border:0;background:none;color:var(--g);padding:10px 8px 10px 0;font-weight:700}
.top .pg{flex:1;text-align:center;font-size:17px;color:var(--mut);font-weight:700}
.top .sz{font:inherit;font-size:15px;border:1.5px solid var(--line);background:#fff;color:var(--tx);border-radius:8px;padding:6px 10px}
.prog{height:6px;background:#e3e8e6;border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;background:var(--g);transition:width .2s}
/* 本文 */
.lead{font-size:.8em;color:var(--mut);font-weight:700;margin:1.1em 0 .2em}
.st p{margin:0 0 .75em}
.st b{font-weight:800;background:linear-gradient(transparent 62%,#cfe9df 62%)}
dl.info{margin:.6em 0;border-top:1px solid var(--line)}
dl.info div{display:flex;gap:12px;border-bottom:1px solid var(--line);padding:.45em 0}
dl.info dt{flex:none;width:5.6em;color:var(--mut);font-size:.8em;padding-top:.2em}
dl.info dd{margin:0;font-weight:700;flex:1;line-height:1.5}
dl.info .fix{font:inherit;font-size:.72em;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:2px 10px;color:var(--g);font-weight:700;align-self:center}
dl.info.sum div{flex-wrap:wrap;gap:0 12px}dl.info.sum dt{width:100%;flex-basis:100%;line-height:1.5;padding:0}dl.info.sum dd{white-space:normal}
.risk{border-left:5px solid var(--g);padding:.1em 0 .1em .7em;margin:0 0 .9em}
.risk .n{font-weight:800}.risk .d{font-size:.9em;line-height:1.65}
.qt{font-weight:800;font-size:1.08em;line-height:1.6;margin:.4em 0 .9em}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;margin:0 0 14px;padding:10px 18px;font:inherit;font-weight:700;text-align:left;color:var(--tx);background:#fff;border:2.5px solid #8b9692;border-radius:14px}
.opt .ck{flex:none;width:30px;height:30px;border:2.5px solid #8b9692;border-radius:50%;display:flex;align-items:center;justify-content:center;color:transparent;font-size:20px;line-height:1}
.opt.on{background:var(--g);border-color:var(--g);color:#fff}.opt.on .ck{background:#fff;border-color:#fff;color:var(--g)}
input[type=text],input[type=tel],input[type=date],select{width:100%;font:inherit;padding:12px;border:2px solid #8b9692;border-radius:10px;background:#fff;color:var(--tx)}
input:focus,select:focus{outline:3px solid #9fd3c2;border-color:var(--g)}
label.f{display:block;font-size:.72em;color:var(--mut);font-weight:700;margin-top:.8em}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.seg{display:flex;gap:8px}.seg button{flex:1;font:inherit;font-size:.85em;padding:10px 4px;border:2px solid #8b9692;background:#fff;border-radius:10px;color:var(--tx)}
.seg button.on{border-color:var(--g);background:var(--g);color:#fff;font-weight:700}
.pad{position:relative;border:2.5px solid #8b9692;border-radius:12px;background:#fff;height:230px;margin:.5em 0 .3em;touch-action:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:12px}
.pad .hint{position:absolute;left:0;right:0;bottom:44px;border-bottom:2px dotted #b6bfbc;margin:0 18px;text-align:center;color:#9aa5a1;pointer-events:none;font-size:.8em;line-height:2.4}
.pad .cl{position:absolute;right:8px;top:8px;z-index:2}
button.s{font:inherit;font-size:.72em;font-weight:700;padding:6px 14px;border:1.5px solid #8b9692;border-radius:8px;background:#fff;color:var(--tx)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom));z-index:6}
.bar .in{max-width:560px;margin:0 auto}
button.p,a.p{display:block;width:100%;min-height:64px;font:inherit;font-weight:800;padding:12px;border:0;border-radius:14px;background:var(--g);color:#fff;text-align:center;text-decoration:none}
button.p:disabled{background:#c3cbc8;color:#fff}
button.p.ghost{background:#fff;color:var(--g);border:2.5px solid var(--g)}
.note{font-size:.76em;color:var(--mut);line-height:1.6}
.err{color:var(--red);font-size:.8em;font-weight:700}
#outImg img{width:100%;border:1px solid var(--line)}
.url{word-break:break-all;font-size:12px;line-height:1.4;background:#eef2f0;border-radius:8px;padding:8px;font-family:ui-monospace,monospace}
.staff{--fs:18px;font-size:18px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="test" id="testNote">【試作・試験モード】サーバーには送りません。架空の名前でお試しください。</div>

  <section id="vStaff" class="staff" hidden>
    <p style="margin:10px 0 0"><a href="../" style="font-size:14px;color:#0F6E56">‹ 院内ツール一覧</a></p>
    <h1>同意書を発行</h1>
    <label class="f">同意書の種類</label>
    <select id="sType"></select>
    <div class="row">
      <div><label class="f">カルテNo.</label><input type="text" id="sKarte" inputmode="numeric"></div>
      <div><label class="f">日付</label><input type="date" id="sDate"></div>
    </div>
    <div id="sPrev" hidden class="note" style="margin-top:8px">前回の内容があります　<button class="s" id="sPrevBtn">前回の内容を入れる</button></div>
    <div class="row">
      <div><label class="f">動物名（ちゃん は自動）</label><input type="text" id="sName"></div>
      <div><label class="f">動物種</label><input type="text" id="sSpecies" list="spL"><datalist id="spL"></datalist></div>
    </div>
    <label class="f" id="sProcL">処置の内容</label><input type="text" id="sProc">
    <div id="sWtBox"><div class="row">
      <div><label class="f">体重</label><div class="row" style="gap:6px"><input type="text" id="sWt" inputmode="decimal"><div class="seg" id="sWu" style="flex:none;width:6.2em"><button data-v="kg" class="on">kg</button><button data-v="g">g</button></div></div></div>
      <div><label class="f">方法</label><div class="seg" id="sMode"><button data-v="全身麻酔下" class="on">全身麻酔下</button><button data-v="鎮静下">鎮静下</button></div></div>
    </div></div>
    <label class="f">この子で特に注意する点（獣医師が記入・空欄可）</label><input type="text" id="sNote" placeholder="例：高齢、心雑音あり、前回覚醒が遅かった">
    <label class="f">担当獣医師</label>
    <select id="sVet"><option>伊村<option>蒲原<option>榮藤<option>伊村（晶）<option>柿本</select>
    <p></p><button class="p" id="sIssue">発行する</button>
    <div id="sOut" hidden>
      <p class="note" style="margin:16px 0 6px"><b>発行しました。</b>① 院内のiPadでサイン：この端末をそのまま渡します。</p>
      <button class="p" id="sHere">この端末でサインしてもらう</button>
      <p class="note" style="margin:14px 0 6px">② LINEで送る：コピーして、飼い主さんとのチャットに貼ります。</p>
      <button class="p ghost" id="sCopy">LINE用の文とリンクをコピー</button>
      <p class="url" id="sUrl"></p>
    </div>
  </section>

  <section id="vOwner" hidden>
    <div class="top">
      <div class="r"><button class="back" id="oBack">‹ 戻る</button><div class="pg" id="oPg"></div><button class="sz" id="oSz">文字を大きく</button></div>
      <div class="prog"><i id="oBar"></i></div>
    </div>
    <div id="oMain"></div>
    <div class="bar"><div class="in"><button class="p" id="oNext"></button></div></div>
  </section>

  <section id="vChk" class="staff" hidden>
    <h1>スタッフに端末をお返しください</h1>
    <p class="note">ご署名ありがとうございました。</p>
    <label class="f">【スタッフ】ご質問がないか口頭で確認した人</label>
    <select id="cStaff"><option value="">選んでください</option></select>
    <p></p><button class="p" id="cDone" disabled>確認して完了</button>
  </section>

  <section id="vDone" hidden>
    <h1>ありがとうございました</h1>
    <p>同意書を受け付けました。<br>この画面は閉じて大丈夫です。</p>
    <div id="out">
      <div class="note">【試作のみ表示】できあがった同意書（PDF・A4）</div>
      <div id="outImg" style="margin:8px 0"></div>
      <a id="outPdf" class="p">PDFを開く</a>
    </div>
  </section>
</div>

<script>
"use strict";
/* ================= 同意書の文面（変えるときはここだけ） ================= */
var STAFF=["院長","晶子","蒲原","榮藤","柿本","山田","坂口","植松","阿部","八柳","三上","三瓶","澤田","平尾","吉田","絹","此田","小野","新岡","内山"];
var Q_ALLERGY={t:"q",id:"allergy",q:"フードやおやつ、薬にアレルギーはありますか",o:["ある","ない"],detail:"ある",dl:"何のアレルギーですか"};
var Q_PAST={t:"q",id:"past",q:"過去に麻酔や鎮静で問題があったことはありますか",o:["ある","ない"],detail:"ある",dl:"どのようなことがありましたか"};
var Q_CHEW={t:"q",id:"chew",q:"ペットシーツやタオルを食べたりかじったりしますか",o:["する","しない"]};
var Q_TEL={t:"q",id:"tel",q:"手術後の電話を希望されますか",o:["する","しない"]};
var FORMS={
 /* ---------- ウサギ・げっ歯類の歯科（下書き：院長確認前） ---------- */
 exo_dental:{
  name:"ウサギ・げっ歯類の歯科処置",v2:true,wt:true,ver:"歯科（ウサギ・げっ歯類）下書き0.2",
  title:"ウサギ・げっ歯類の歯科処置に対する同意書",
  species:["ウサギ","モルモット","チンチラ","デグー","ハムスター","ラット"],
  procLabel:"処置の内容",procDefault:"臼歯・切歯の切削、かみ合わせの調整",
  intro:["当院では処置にあたって飼い主様のご承諾をいただいております。","下記の事項をよくお読みになり、ご確認とご署名をお願いいたします。"],
  body:[
   {t:"c",e:["{mode}","麻酔下で初めて分かる異常","追加の検査や処置"],x:"今回は{mode}で、伸びすぎた歯やとがった歯を削り、かみ合わせを整えます。口の奥は起きている状態では十分に確認できないため、麻酔下で初めて分かる異常（歯の根の病気、膿、口の中の傷など）があります。その場合は、追加の検査や処置を行うことがあります。"},
   {t:"c",e:["一生伸び続けます","処置を繰り返す必要"],x:"ウサギやげっ歯類の歯は一生伸び続けます。今回の処置で完治するものではなく、多くの場合、定期的に処置を繰り返す必要があります。"},
   {t:"c",e:["100％安全な処置ではありません","犬や猫に比べて","死亡するリスクが高い","死亡または重い後遺症"],x:"麻酔・鎮静は100％安全な処置ではありません。ウサギやげっ歯類は、犬や猫に比べて麻酔中や術後に死亡するリスクが高いことが報告されています。検査で異常がなくても、まれに死亡または重い後遺症に至る場合があります。"},
   {t:"c",e:["対応には限りがあります","見つかっていない病気がある可能性"],x:"体が小さいため、採血・血管の確保・気管挿管が難しく、術前の検査や麻酔中の対応には限りがあります。また、病気を隠す性質があり、見つかっていない病気がある可能性があります。"},
   {t:"c",sp:/ウサギ|うさぎ|兎|兔/,e:["骨折するリスクが高い","命の危険"],x:"ウサギは、処置や注射の際、また麻酔から覚める際に暴れて骨折するリスクが高い動物です。特に背骨（脊椎）や大きな骨の骨折が起こった場合には、命の危険があります。"},
   {t:"c",x:"今回の処置・麻酔で起こりうるリスクは以下のものがあります。",b:[
     "呼吸の抑制・低酸素：呼吸が弱くなり、体の酸素が不足することがあります",
     "低体温・低血糖：体が小さいため、体温や血糖が下がりやすくなります",
     "誤嚥：口の中の水分や削った歯の粉が気管に入り、肺炎を起こす可能性があります",
     "口の中の傷・出血：器具や歯の切削により、舌・頬・歯ぐきに傷がつくことがあります",
     "歯や顎の損傷：もろくなった歯が折れたり、まれに顎の骨が折れることがあります",
     "術後の食欲低下・消化管うっ滞：術後に食べなくなり、胃腸の動きが止まることがあります。命に関わるため、強制給餌や入院が必要になる場合があります",
     "ショック・心肺停止：麻酔薬への反応や体質により、突然の血圧低下や心肺停止が起こる場合があります"]},
   {t:"c",e:["連絡を待たずに行い","実施した分の費用"],x:"万が一、緊急の変化を起こした場合には、救命のための処置を連絡を待たずに行い、速やかにご連絡させて頂きます。緊急処置や追加の投薬を行った場合、また処置を中止した場合も、実施した分の費用はご請求させて頂きます。"},
   {t:"c",e:["保温","食欲と便","すぐにご連絡ください"],x:"帰宅後は保温し、食欲と便の様子を確認してください。【仮：12時間】たっても食べない、便が出ない、ぐったりしている場合は、すぐにご連絡ください。"},
   {t:"h",x:"確認事項"},
   {t:"q",id:"xray",q:"麻酔・鎮静前のレントゲン検査を希望しますか",o:["する","しない"]},
   {t:"q",id:"blood",q:"麻酔・鎮静前の血液検査を希望しますか",o:["する","しない"]},
   {t:"q",id:"eat",q:"今朝、いつもどおり食べていますか",o:["はい","いいえ"],detail:"いいえ",dl:"いつから食べていませんか"},
   {t:"q",id:"stool",q:"便はいつもどおり出ていますか",o:["はい","いいえ"]},
   {t:"q",id:"ill",q:"持病や、現在飲んでいる薬・サプリはありますか",o:["ある","ない"],detail:"ある",dl:"病名・薬の名前"},
   Q_ALLERGY,Q_PAST,
   {t:"q",id:"extra",q:"麻酔下で抜歯などの追加処置が必要と判断した場合",o:["連絡なしで行ってよい","まず連絡がほしい"]},
   {t:"q",id:"proceed",q:"→連絡が付かなかった場合、獣医師の判断で処置を実施して良いか",o:["可","不可"],sub:1,when:function(A){return A.extra==="まず連絡がほしい"}},
   {t:"q",id:"cpr",q:"心肺停止となった場合、蘇生処置を希望しますか",o:["する","しない"]},
   {t:"q",id:"tel",q:"処置後の電話を希望されますか",o:["する","しない"]},
   {t:"q",id:"photo",q:"処置中の写真を、学会発表・院内教育・病院からの情報発信に使用してよいですか（飼い主様が特定される情報は出しません）",o:["よい","使用しない"]}
  ]
 },
 /* ---------- 犬・猫のスケーリング・抜歯（下書き：院長確認前） ---------- */
 dc_dental:{
  name:"犬・猫のスケーリング・抜歯",v2:true,wt:true,ver:"歯科（犬・猫）下書き0.1",
  title:"スケーリング・抜歯に対する同意書",
  species:["犬","猫"],
  procLabel:"処置の内容",procDefault:"スケーリング（歯石除去）・歯科検査・必要に応じて抜歯",
  intro:["当院では処置にあたって飼い主様のご承諾をいただいております。","下記の事項をよくお読みになり、ご確認とご署名をお願いいたします。"],
  body:[
   {t:"c",e:["{mode}","麻酔下の検査で初めて分かります","処置中に決まります"],x:"今回は{mode}で、歯石の除去（スケーリング）と歯の表面の研磨を行い、歯周ポケットの検査と、必要に応じて歯科レントゲン検査を行います。歯の根や顎の骨の状態は、麻酔下の検査で初めて分かります。そのため、抜歯が必要な歯とその本数は、処置中に決まります。"},
   {t:"c",e:["抜歯します","歯ぐきを切開し、歯を分割し、縫合する","費用と処置時間が変わります"],x:"重度の歯周病、歯の根の病気、折れた歯、歯が溶ける病気（吸収病巣）などがあり、残すと痛みや感染が続くと判断した歯は抜歯します。抜歯では、歯ぐきを切開し、歯を分割し、縫合することがあります。抜歯の本数によって、費用と処置時間が変わります。"},
   {t:"c",e:["100％安全な処置ではありません","死亡または重い後遺症","リスクが高くなります"],x:"全身麻酔・鎮静は100％安全な処置ではありません。検査で異常がなくても、体質や不測の事態により、まれに死亡または重い後遺症に至る場合があります。高齢の動物や持病のある動物では、リスクが高くなります。"},
   {t:"c",e:["血圧・心拍の低下や呼吸の抑制"],x:"麻酔時には、血圧・心拍の低下や呼吸の抑制が一般的に発生します。その他、今回の処置・麻酔で起こりうるリスクは以下のものがあります。",b:[
     "出血：抜歯した部位から出血することがあります",
     "顎の骨折：歯周病で顎の骨がもろくなっている場合（特に小型犬の下顎）、抜歯の際やその後に顎の骨が折れることがあります",
     "口と鼻がつながる穴（口鼻瘻）：上顎の歯を抜いた後、口と鼻がつながり、くしゃみや鼻水が続くことがあります。再手術が必要になる場合があります",
     "歯の根の取り残し：根が骨と癒着している、または折れやすい場合、根の一部が残ることがあります",
     "縫合部の離開・感染：縫った部位が開いたり、腫れや感染が起こることがあります",
     "周囲の組織や神経の損傷：舌・唇・眼の周囲や神経に傷がつき、しびれや違和感が残ることがあります",
     "誤嚥：水分や歯石、吐物が気管に入り、肺炎を起こす可能性があります",
     "気管チューブによる影響：咳やのどの違和感が数日続くことがあります。まれに気管を傷つけることがあります",

  function size(){var r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);ctx.lineWidth=3.2*d;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#111";P.ink=false;h.hidden=false}
  size();
  function pos(e){var r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}
  c.addEventListener("pointerdown",function(e){e.preventDefault();down=true;c.setPointerCapture&&c.setPointerCapture(e.pointerId);var p=pos(e);lx=p[0];ly=p[1];ctx.beginPath();ctx.arc(lx,ly,ctx.lineWidth/2,0,7);ctx.fillStyle="#111";ctx.fill();P.ink=true;h.hidden=true;btnState()});

/* ================= 同意書の画像（A4縦 150dpi・必要なら2枚）とPDF ================= */
var PW=1240,PH=1754,MX=96,TM=90;
var MIN='"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif CJK JP","Noto Serif JP",serif';
function wrap(ctx,text,maxW){var out=[],line="",NO="、。，．）」』】・：；？！ー％",i,ch;
  for(i=0;i<text.length;i++){ch=text[i];if(ch==="\n"){out.push(line);line="";continue}
    if(ctx.measureText(line+ch).width>maxW&&line&&NO.indexOf(ch)<0){out.push(line);line=ch}else line+=ch}
  if(line)out.push(line);return out}
function buildDoc(R){
  var tall=document.createElement("canvas");tall.width=PW;tall.height=PH*3;
  var sc=[1,0.95,0.9,0.86],res,i,one=false;
  for(i=0;i<sc.length;i++){res=layout(tall,R,sc[i]);if(res.y<=PH-70){one=true;break}}
  if(!one)res=layout(tall,R,0.94);
  var end=res.y+30,cuts=[0],lim=PH-90;
  while(!one&&end>lim){var c=0;res.brk.forEach(function(b){if(b<=lim&&b>cuts[cuts.length-1]+200)c=b});if(!c)c=lim;cuts.push(c);lim=c+(PH-90-TM)}
  cuts.push(end);
  var pages=[];
  for(i=0;i<cuts.length-1;i++){var p=document.createElement("canvas");p.width=PW;p.height=PH;var x=p.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,PW,PH);
    var h=cuts[i+1]-cuts[i];x.drawImage(tall,0,cuts[i],PW,h,0,i?TM:0,PW,h);
    if(cuts.length>2){x.fillStyle="#555";x.font="17px "+MIN;x.textAlign="center";x.fillText(FORMS[R.d.type].title+"　発行ID "+R.d.id+"　"+(i+1)+"／"+(cuts.length-1),PW/2,PH-40)}
    pages.push(p)}
  return pages;
}
function layout(c,R,s){
  var ctx=c.getContext("2d"),D=R.d,F=FORMS[D.type],W=PW-MX*2,y=0,brk=[];
  var fs=Math.round(25*s),lh=Math.round(fs*1.52);
  ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle="#111";ctx.textBaseline="alphabetic";ctx.textAlign="left";
  function font(px,b){ctx.font=(b?"bold ":"")+px+"px "+MIN}
  function line(y1,w,col){ctx.strokeStyle=col||"#111";ctx.lineWidth=w||1.5;ctx.beginPath();ctx.moveTo(MX,y1);ctx.lineTo(PW-MX,y1);ctx.stroke()}

  y+=Math.round(18*s);F.intro.forEach(function(t){para(t,MX,0)});

  y+=Math.round(lh*1.25);field(F.procLabel,D.proc,MX);
  if(F.wt){font(fs);ctx.textAlign="right";ctx.fillText("体重　"+(wtText(D)||"　　kg"),PW-MX,y);ctx.textAlign="left"}
  line(y+10,1.2);
  y+=Math.round(lh*1.25);field("動物名",D.name+" ちゃん",MX);field("動物種",D.species,MX+W*0.5);field("カルテNo.",D.karte,MX+W*0.76);line(y+10,1.2);
  y+=Math.round(lh*0.35);
  var bx=Math.round(fs*0.95),ind=bx+22;
  function cbox(yy){ctx.lineWidth=2;ctx.strokeStyle="#111";ctx.strokeRect(MX,yy-bx+4,bx,bx);ctx.lineWidth=3.2;ctx.beginPath();ctx.moveTo(MX+4,yy-bx/2+4);ctx.lineTo(MX+bx*0.4,yy);ctx.lineTo(MX+bx+5,yy-bx-2);ctx.stroke()}

    var txt=(it.q.charAt(0)==="→"?"":"※")+it.q,stack=(PW-MX-x-ow)<W*0.42;
    var ls=wrap(ctx,txt,stack?PW-MX-x:PW-MX-x-ow);ls.forEach(function(l){y+=lh;ctx.fillText(l,x,y)});if(stack)y+=lh;
    var qy=y,ax=PW-MX-14;ctx.textAlign="right";
    for(i=it.o.length-1;i>=0;i--){var o=it.o[i];font(fs,o===a);var w=ctx.measureText(o).width;ctx.fillStyle=(o===a)?"#111":"#aaa";ctx.fillText(o,ax,qy);
      if(o===a){ctx.lineWidth=2.4;ctx.strokeStyle="#111";ctx.beginPath();ctx.ellipse(ax-w/2,qy-fs*0.36,w/2+13,fs*0.72,0,0,Math.PI*2);ctx.stroke()}
      ax-=w;if(i>0){font(fs);ctx.fillStyle="#aaa";var sw=ctx.measureText(" / ").width;ctx.fillText(" / ",ax,qy);ax-=sw}}
    ctx.fillStyle="#111";ctx.textAlign="left";ctx.lineWidth=1;ctx.strokeStyle="#111";ctx.beginPath();ctx.moveTo(x,qy+6);ctx.lineTo(PW-MX,qy+6);ctx.stroke();
    if(R.ans[it.id+"_d"]){font(Math.round(fs*0.92));wrap(ctx,"　内容："+R.ans[it.id+"_d"],PW-MX-x).forEach(function(l){y+=lh;ctx.fillText(l,x,y)})}
  }
  bodyOf(D).forEach(function(it){
    if(it.t==="c"){mark();y+=Math.round(lh*0.22);var y0=y+lh;para(fill(it.x,D),MX,ind);cbox(y0);
      if(it.b)it.b.forEach(function(b){font(fs);var ls=wrap(ctx,b,W-ind-30);ls.forEach(function(l,i){y+=lh;if(i===0)ctx.fillText("•",MX+ind-4,y);ctx.fillText(l,MX+ind+24,y)})})}
    else if(it.t==="h"){mark();y+=Math.round(lh*0.5);para(it.x,MX,0,true)}
    else if(it.t==="q"){if(!vis(it,R.ans))return;mark();ans(it,MX+(it.sub?ind+30:ind))}
  });
  // 署名（途中で改ページしない）
  mark();y+=Math.round(lh*0.7);
  if(F.v2){para(SIGN_V2,MX,0,true);y+=Math.round(lh*0.2)}
  font(Math.round(fs*1.15),true);y+=lh;ctx.fillText("ご署名",MX,y);var tw=ctx.measureText("ご署名").width;font(Math.round(fs*0.8));
  ctx.fillText(F.v2?"（画面への署名を、手書きの署名と同じものとして扱います）":"（ご確認頂いたご家族皆様の署名をお願いします）",MX+tw+6,y);
  if(!F.v2){y+=lh;font(Math.round(fs*0.85));ctx.fillText("上記内容を理解しました",MX,y)}
  var n=R.sigs.length,sh=Math.round((n>2?120:150)*s),gap=24,sw=Math.min(420,(W-gap*(n-1))/n);y+=10;
  R.sigs.forEach(function(sc,i){var b=inkBox(sc);if(!b)return;var k=Math.min(sw/b.w,sh/b.h);ctx.drawImage(sc,b.x,b.y,b.w,b.h,MX+i*(sw+gap),y+(sh-b.h*k)/2,b.w*k,b.h*k)});
  y+=sh+8;line(y,1.2);
  if(F.v2){y+=Math.round(lh*1.15);font(fs);ctx.fillText("お名前：　"+R.who.name+"　（"+R.who.rel+"）",MX,y);line(y+10,1.2)}
  y+=Math.round(lh*1.15);font(fs);ctx.fillText("緊急時の電話番号：　"+R.tel+(R.tel2?"　／　"+R.tel2:""),MX,y);line(y+10,1.2);
  if(F.v2){y+=Math.round(lh*1.15);font(fs);ctx.fillText("当日の口頭確認（スタッフ）：　"+(R.staff||"　　　　　　"),MX,y);line(y+10,1.2)}
  y+=Math.round(lh*1.0);font(Math.round(17*s));ctx.fillStyle="#555";
  ctx.fillText("電子署名（画面への手書き）　署名日時 "+R.signedAt+"　発行ID "+D.id+"　版："+F.ver+"　ポックル動物病院",MX,y);ctx.fillStyle="#111";
  return {y:y,brk:brk};
}
function inkBox(c){var x=c.getContext("2d"),d=x.getImageData(0,0,c.width,c.height).data,w=c.width,h=c.height,x0=w,y0=h,x1=-1,y1=-1,i,j;
  for(j=0;j<h;j+=2)for(i=0;i<w;i+=2)if(d[(j*w+i)*4+3]>40){if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j}
  if(x1<0)return null;var p=8;x0=Math.max(0,x0-p);y0=Math.max(0,y0-p);x1=Math.min(w,x1+p);y1=Math.min(h,y1+p);return {x:x0,y:y0,w:x1-x0,h:y1-y0}}
function jpegsToPdf(urls,w,h){
  var parts=[],off=[],len=0,n=urls.length,i;
  function put(s){var u=(typeof s==="string")?Uint8Array.from(s,function(ch){return ch.charCodeAt(0)}):s;parts.push(u);len+=u.length}
  function obj(k,s){off[k]=len;put(k+" 0 obj\n"+s)}

  obj(1,"<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
  var kids=[];for(i=0;i<n;i++)kids.push((3+i*3)+" 0 R");
  obj(2,"<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+n+" >>\nendobj\n");
  var cs="q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";
  for(i=0;i<n;i++){var a=3+i*3,bin=atob(urls[i].split(",")[1]),img=new Uint8Array(bin.length),j;for(j=0;j<bin.length;j++)img[j]=bin.charCodeAt(j);
    obj(a,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 "+(a+1)+" 0 R >> >> /Contents "+(a+2)+" 0 R >>\nendobj\n");
    obj(a+1,"<< /Type /XObject /Subtype /Image /Width "+w+" /Height "+h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+img.length+" >>\nstream\n");put(img);put("\nendstream\nendobj\n");
    obj(a+2,"<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream\nendobj\n")}

  var out=new Uint8Array(len),p=0;parts.forEach(function(u){out.set(u,p);p+=u.length});return out;
}
