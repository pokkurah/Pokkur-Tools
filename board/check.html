<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>チェックリスト | 院内ボード</title>
<script src="../gate.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7f8;color:#1f2a2e;font-family:"Meiryo UI","Yu Gothic UI",-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px}
button{font:inherit;border:1px solid #b9c4c8;background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;color:#1f2a2e}
button.pri{background:#1f8670;border-color:#1f8670;color:#fff}
.hd{background:#1f2a2e;color:#fff;padding:10px 12px}
.hd .t{display:flex;align-items:center;gap:8px}
.hd h1{font-size:20px;margin:0}
.hd select{font:inherit;font-size:14px;padding:3px 6px;margin-left:auto}
.hd .tot{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:#cfe}
.bar{height:10px;background:rgba(255,255,255,.2);border-radius:5px;flex:1;overflow:hidden}
.bar i{display:block;height:100%;background:#4fd1a5;transition:width .3s}
.me{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:16px;font-weight:700;background:#fff;border-bottom:1px solid #e3e8ea}
.me .bar{background:#e3e8ea}.me .bar i{background:#1f8670}
.it{display:flex;gap:12px;align-items:center;padding:14px 14px;background:#fff;border-bottom:1px solid #eef1f2;cursor:pointer;user-select:none;font-size:17px}
.it:hover{background:#f3faf7}
.sec{background:#e8eef0;color:#46555b;font-size:13px;font-weight:700;padding:5px 14px}
.it .b{width:28px;height:28px;border:2px solid #9aa6aa;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.it.on{color:#9aa6aa;text-decoration:line-through}
.it.on .b{background:#1f8670;border-color:#1f8670}
.it.wait{opacity:.5}
.done{margin:16px;padding:18px;background:#1f8670;color:#fff;border-radius:12px;text-align:center;font-size:20px;font-weight:800}
.foot{display:flex;gap:8px;padding:12px;flex-wrap:wrap}
.foot .sp{flex:1}
textarea{width:100%;font:inherit;font-size:15px;line-height:1.6;padding:8px;border:1px solid #b9c4c8;border-radius:8px;min-height:240px}
.ed{padding:12px;background:#fff}
.ed p{font-size:12px;color:#6b7a80;margin:0 0 6px}
.err{padding:8px 12px;color:#c62828;font-size:13px;background:#fff3f3}
.mock{background:#333;color:#fff;font-size:11px;text-align:center;padding:2px}
.hide{display:none!important}
</style></head><body>
<div class="mock hide" id="mockbar">試験モード（このPC内だけのデータ）</div>
<div class="hd"><div class="t"><h1 id="ttl">チェックリスト</h1><select id="area"></select></div>
<div class="tot">全体<div class="bar"><i id="totBar"></i></div><span id="totTxt"></span></div></div>
<div class="me"><span id="meTxt"></span><div class="bar"><i id="meBar"></i></div></div>
<div id="list"></div>
<div class="done hide" id="done">✓ この場所は完了です</div>
<div class="ed hide" id="ed"><p>1行に1項目。「■」で始めた行は見出し（チェックしない）。保存すると全PCの項目が変わります（その日のチェックは、名前が同じ項目だけ残ります）。</p>
<textarea id="tx"></textarea>
<div class="foot"><button id="edCancel">やめる</button><span class="sp"></span><button class="pri" id="edSave">保存</button></div></div>
<div class="err hide" id="err"></div>
<div class="foot" id="foot"><button id="edBtn">項目を編集</button><span class="sp"></span><button class="pri" id="closeBtn">閉じる</button></div>

<script src="logic.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script>
(function(){
var L=BoardLogic,$=function(id){return document.getElementById(id)},KEY=BOARD.key();
if(!KEY)setTimeout(function(){err('このPCは院内キーが未登録です。院内ボードで院内キーを入れてください。')},0);
var S=null,busy=false,pend={},editing=false,closing=null;
if(BOARD.isMock)$('mockbar').classList.remove('hide');
var q=new URLSearchParams(location.search),area=q.get('area');
if(L.AREAS.indexOf(area)<0)area=localStorage.getItem('pbd_place')||L.AREAS[0];
L.AREAS.forEach(function(a){$('area').appendChild(new Option(a,a))});$('area').value=area;
$('area').addEventListener('change',function(){area=$('area').value;history.replaceState(null,'','?area='+encodeURIComponent(area));draw()});
function err(t){$('err').textContent=t;$('err').classList.remove('hide');setTimeout(function(){$('err').classList.add('hide')},6000)}

function load(){
  if(busy||!KEY)return;busy=true;
  BOARD.state(KEY,S&&S.v).then(function(r){if(!r.ok)throw new Error(r.err);if(!r.same){S=r.s;draw()}})
  .catch(function(e){err('更新できません：'+(e.message||e))}).then(function(){busy=false});
}
function act(p){return BOARD.act(KEY,p).then(function(r){if(!r.ok){err('できませんでした：'+r.err);return false}S=r.s;draw();return true}).catch(function(e){err('通信できませんでした：'+(e.message||e));return false})}

function draw(){
  if(!S)return;
  $('ttl').textContent=area;document.title=area+' チェックリスト';
  var P=L.progress(S),me=P.per[area];
  $('totBar').style.width=P.pct+'%';$('totTxt').textContent=P.done+'/'+P.all+'（'+P.pct+'%）';
  $('meTxt').textContent=me.done+'/'+me.all;$('meBar').style.width=(me.all?me.done*100/me.all:0)+'%';
  var Lst=$('list');Lst.innerHTML='';
  (S.tpl[area]||[]).forEach(function(t){
    if(L.isHead(t)){var hd=document.createElement('div');hd.className='sec';hd.textContent=t.slice(1);Lst.appendChild(hd);return}
    var k=L.ckey(area,t),on=pend[k]!=null?pend[k]:!!S.day.checks[k];
    var r=document.createElement('div');r.className='it'+(on?' on':'')+(pend[k]!=null?' wait':'');
    var b=document.createElement('span');b.className='b';b.textContent=on?'✓':'';r.appendChild(b);
    r.appendChild(document.createTextNode(t));
    r.addEventListener('click',function(){
      if(pend[k]!=null)return;pend[k]=!on;draw();
      act({action:'check',area:area,text:t,on:!on}).then(function(){delete pend[k];draw()});
    });
    Lst.appendChild(r);
  });
  var full=me.all&&me.done===me.all&&!Object.keys(pend).length;
  $('done').classList.toggle('hide',!full||editing);
  /* 全部埋まったら自動で閉じる（ボードから開いた窓のとき） */
  if(full&&!editing&&window.opener&&!closing){closing=setTimeout(function(){window.close()},2500)}
  if(!full&&closing){clearTimeout(closing);closing=null}
}
$('closeBtn').addEventListener('click',function(){window.close();setTimeout(function(){location.href='./'},300)});
$('edBtn').addEventListener('click',function(){if(!S)return;editing=true;$('tx').value=(S.tpl[area]||[]).join('\n');$('ed').classList.remove('hide');$('list').classList.add('hide');$('foot').classList.add('hide');draw()});
function endEdit(){editing=false;$('ed').classList.add('hide');$('list').classList.remove('hide');$('foot').classList.remove('hide');draw()}
$('edCancel').addEventListener('click',endEdit);
$('edSave').addEventListener('click',function(){act({action:'setTpl',area:area,items:$('tx').value}).then(function(ok){if(ok)endEdit()})});
window.addEventListener('storage',function(e){if(e.key==='pbd_mock_db')load()});
load();setInterval(load,BOARD.isMock?2000:4000);
})();
</script>
</body></html>
