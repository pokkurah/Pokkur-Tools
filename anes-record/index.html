<style>

body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px}

.bar .nx{font-size:12px;text-align:right;line-height:1.2}
.bar .nx b{font-size:16px;font-variant-numeric:tabular-nums}

.vrow input.val{flex:1;min-width:0;text-align:center;font-size:24px;font-weight:700;height:46px;padding:0}
.vrow input.val.empty{color:#b9c3c7}
.vrow input.val.act{outline:3px solid var(--mint);background:var(--mint-l)}
.kp{position:sticky;bottom:-14px;background:#fff;border-top:1px solid var(--line);margin:8px -14px -14px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:6px;z-index:2}
.kp button{height:48px;border-radius:10px;border:1px solid var(--line);background:#f7f9fa;font-size:22px;font-weight:600;color:var(--ink)}

.kp .kl{grid-column:1/5;font-size:12px;color:var(--sub);text-align:center}
.vrow .same{font-size:11px;padding:4px 6px;border-radius:8px;border:1px dashed var(--mint);background:#fff;color:var(--mint-d);white-space:nowrap}
.vrow .seg{flex:1} .vrow .seg button{padding:7px 8px;font-size:13px;min-height:40px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:18px;padding:8px 12px;font-size:13px;color:var(--ink);text-align:left}
.chips button small{color:var(--sub)} .chips button.em{border-color:#f1c4bf;color:var(--warn)}
.chips button.done{background:var(--mint-l);border-color:var(--mint)}

.trow{display:flex;align-items:center;gap:6px;justify-content:center;margin:4px 0 8px}

body.embed main{padding-top:0}

body.disp{background:#0d1417;color:#e8eef0;overflow:hidden}
body.disp main{display:none}
#D{display:none}

.dh{grid-column:1/3;display:flex;align-items:center;gap:18px;border-bottom:1px solid #26363c;padding-bottom:10px}
.dh .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.dh .ctl{display:flex;align-items:center;gap:10px}
body.disp{--tz:8.5vh}
body.disp.bigt{--tz:15vh}
.tmr{display:flex;gap:14px;flex:0 0 auto}
.tb{border-radius:16px;padding:6px 20px 10px;text-align:right;line-height:1}
.tb .lb{font-size:calc(var(--tz)*0.3);font-weight:700;display:flex;justify-content:space-between;gap:14px;margin-bottom:4px}
.tb .lb small{font-weight:600;opacity:.85}
.tb .tv{font-size:var(--tz);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tb.an{background:#0c3a31;border:3px solid #2fd3a8;color:#5ff0c6}
.tb.cut{background:#432808;border:3px solid #ff9f2e;color:#ffb547}
.tb.off{opacity:.4}
.tb.stop .tv{opacity:.75}
.dh .who{font-size:30px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh .who small{font-size:20px;color:#9fb3b9;font-weight:500;margin-left:12px}
.dh .el{margin-left:auto;font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;color:#7fe0c4}
.dh .el small{font-size:16px;color:#9fb3b9;margin-right:6px;font-weight:500}
.dh .clk{font-size:22px;color:#9fb3b9;font-variant-numeric:tabular-nums}
#Dg{position:relative;min-height:0}
#Dg canvas{width:100%;height:100%;display:block}
.ds{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden}
.tile{background:#152126;border-radius:12px;padding:8px 12px;display:flex;align-items:baseline;gap:8px}
.tile .l{font-size:15px;color:#9fb3b9;flex:0 0 96px}
.tile .v{font-size:42px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05;margin-left:auto}
.tile .u{font-size:13px;color:#9fb3b9;flex:0 0 46px}
.tile.y{background:#3a2e10} .tile.y .v{color:#ffcc4d}
.tile.r{background:#4a1714} .tile.r .v{color:#ff7466;animation:bl 1.2s infinite}
.dnext{background:#152126;border-radius:12px;padding:8px 12px;font-size:16px;color:#9fb3b9}
.dnext b{font-size:26px;color:#e8eef0;font-variant-numeric:tabular-nums;margin-left:8px}
.dnext.due{background:#4a1714} .dnext.due b{color:#ff7466}
.dlog{background:#152126;border-radius:12px;padding:8px 12px;font-size:15px;flex:1;min-height:0;overflow:hidden}
.dlog div{padding:3px 0;border-top:1px solid #22323a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlog div:first-child{border-top:0}
.dlog .tm{color:#9fb3b9;margin-right:8px;font-variant-numeric:tabular-nums}
.dmsg{grid-column:1/3;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-size:22px;color:#9fb3b9}
.dmsg button{font-size:20px;padding:14px 22px;border-radius:12px;border:1px solid #2fa88e;background:#152126;color:#e8eef0;min-width:420px;text-align:left}
.dmsg input{font-size:22px;padding:10px;border-radius:10px;border:1px solid #2fa88e;background:#152126;color:#fff;text-align:center}
.dwarn{position:fixed;left:16px;bottom:16px;background:#4a1714;color:#ffb3aa;padding:8px 18px;border-radius:10px;font-size:18px;display:none}
</style>

    if(j.ok&&j.stale){ /* 別の端末（大画面PCの臨時入力など）の方が新しい → そちらを取り込む */
