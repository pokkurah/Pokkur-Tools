<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>チェックリスト | 院内ボード</title>
<script src="../gate.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7f8;color:#1f2a2e;font-family:"Meiryo UI","Yu Gothic UI",-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px}
button{font:inherit;border:1px solid #b9c4c8;background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;color:#1f2a2e}
button.pri{background:#1f8670;border-color:#1f8670;color:#fff}
.hd{background:#1f2a2e;color:#fff;padding:10px 12px;position:sticky;top:0;z-index:2}
.hd .t{display:flex;align-items:center;gap:8px}
.hd h1{font-size:20px;margin:0}
.hd select{font:inherit;font-size:14px;padding:3px 6px;margin-left:auto}
.hd .tot{display:flex;align-items:center;gap:8px;font-size:13px;color:#cfe}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.nav button{position:relative;overflow:hidden;padding:5px 2px 7px;font-size:12px;line-height:1.25;background:#3a474c;color:#fff;border-color:#55646a}
.nav button small{display:block;font-size:11px;color:#cfe;font-variant-numeric:tabular-nums}
.nav button i{position:absolute;left:0;bottom:0;height:4px;background:#4fd1a5}
.nav button.full{background:#1f8670;border-color:#1f8670}
.nav button.cur{background:#fff;color:#1f2a2e;border-color:#fff;font-weight:800}
.nav button.cur small{color:#46555b}.nav button.cur i{background:#1f8670}
.nav button.cur.full{background:#d9f3ea}
.bar{height:10px;background:rgba(255,255,255,.2);border-radius:5px;flex:1;overflow:hidden}
.bar i{display:block;height:100%;background:#4fd1a5;transition:width .3s}
.me{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:16px;font-weight:700;background:#fff;border-bottom:1px solid #e3e8ea}
.me .bar{background:#e3e8ea}.me .bar i{background:#1f8670}
.sec{background:#e8eef0;color:#46555b;font-size:13px;font-weight:700;padding:5px 14px}
.it{display:flex;gap:12px;align-items:center;padding:12px 10px 12px 14px;background:#fff;border-bottom:1px solid #eef1f2;cursor:pointer;user-select:none;font-size:17px}
.it:hover{background:#f3faf7}
.it .b{width:28px;height:28px;border:2px solid #9aa6aa;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.it .tx{flex:1}
.it .na{font-size:11px;padding:3px 6px;color:#6b7a80;flex-shrink:0}
.it .tag{font-size:11px;background:#eef1f2;color:#6b7a80;border-radius:10px;padding:1px 7px;margin-left:6px;white-space:nowrap;text-decoration:none;display:inline-block}
.it.on{color:#9aa6aa}.it.on .tx{text-decoration:line-through}
.it.on .b{background:#1f8670;border-color:#1f8670}
.it.off{color:#b0bbbf;background:#f7f9f9;cursor:default}.it.off .b{border-style:dashed;border-color:#cfd8db}
.it.wait{opacity:.5}
.done{margin:16px;padding:18px;background:#1f8670;color:#fff;border-radius:12px;text-align:center;font-size:20px;font-weight:800}
.foot{display:flex;gap:8px;padding:12px;flex-wrap:wrap}
.foot .sp{flex:1}
textarea{width:100%;font:inherit;font-size:15px;line-height:1.6;padding:8px;border:1px solid #b9c4c8;border-radius:8px;min-height:240px}
.ed{padding:12px;background:#fff}
.ed p{font-size:12px;color:#6b7a80;margin:0 0 6px}
.err{padding:8px 12px;color:#c62828;font-size:13px;background:#fff3f3}
.mock{background:#333;color:#fff;font-size:11px;text-align:center;padding:2px}
.hide{display:none!important}
</style></head><body>
<div class="mock hide" id="mockbar">試験モード（このPC内だけのデータ）</div>
<div class="hd"><div class="tot">全体<div class="bar"><i id="totBar"></i></div><span id="totTxt"></span></div>
<div class="nav" id="nav"></div></div>
<div class="me"><span id="ttl"></span><span id="meTxt"></span><div class="bar"><i id="meBar"></i></div></div>
<div id="list"></div>
<div class="done hide" id="done">✓ ここは完了です</div>
<div class="ed hide" id="ed"><p>1行に1項目。保存すると全PCの項目が変わります。<br>「■」で始めた行は見出し。「（水曜）」のように曜日を入れるとその曜日だけ数えます。「月1」「週1」「月末」を含む行は任意（％に数えない）。</p>
<textarea id="tx"></textarea>
<div class="foot"><button id="edCancel">やめる</button><span class="sp"></span><button class="pri" id="edSave">保存</button></div></div>
<div class="err hide" id="err"></div>
<div class="foot" id="foot"><button id="edBtn">項目を編集</button><span class="sp"></span><button class="pri" id="closeBtn">閉じる</button></div>

<script src="logic.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script>
(function(){
var L=BoardLogic,$=function(id){return document.getElementById(id)},KEY=BOARD.key();
var S=null,busy=false,pend={},editing=false,closing=null,wasFull=true,myLast=0,first=true;
if(BOARD.isMock)$('mockbar').classList.remove('hide');
var q=new URLSearchParams(location.search),area=q.get('area');
if(L.AREAS.indexOf(area)<0)area=localStorage.getItem('pbd_place');
if(L.AREAS.indexOf(area)<0)area=L.AREAS[0];
/* 上のボタンで別の場所へ切り替える（窓はそのまま） */
function go(a){if(a===area)return;wasFull=true;myLast=0;if(closing){clearTimeout(closing);closing=null}pend={};area=a;history.replaceState(null,'','?area='+encodeURIComponent(area));if(editing)endEdit();else draw();window.scrollTo(0,0)}
function err(t){$('err').textContent=t;$('err').classList.remove('hide');setTimeout(function(){$('err').classList.add('hide')},6000)}
if(!KEY)err('このPCは院内キーが未登録です。院内ボードで院内キーを入れてください。');
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

function load(){
  if(busy||!KEY)return;busy=true;
  BOARD.state(KEY,S&&S.sig).then(function(r){if(!r.ok)throw new Error(r.err);if(!r.same){S=r.s;draw()}})
  .catch(function(e){err('更新できません：'+(e.message||e))}).then(function(){busy=false});
}
function act(p){return BOARD.act(KEY,p).then(function(r){if(!r.ok){err('できませんでした：'+r.err);return false}S=r.s;draw();try{window.opener&&window.opener.__pbdLoad&&window.opener.__pbdLoad()}catch(e){}return true}).catch(function(e){err('通信できませんでした：'+(e.message||e));return false})}

function draw(){
  if(!S)return;
  $('ttl').textContent=area;document.title=area+' チェックリスト';
  var P=L.progress(S),me=P.per[area];
  /* すべての場所のボタン：どこがどれだけ済んだか＋押すとその一覧へ */
  var N=$('nav');N.innerHTML='';
  L.AREAS.forEach(function(a){var q=P.per[a],b=el('button',(a===area?'cur':'')+(q.done===q.all?' full':''));b.type='button';
    b.appendChild(document.createTextNode(a.replace('検査台・入院舎','検査台・入院')));b.appendChild(el('small','',(q.done===q.all?'✓ ':'')+q.done+'/'+q.all));
    var i=el('i');i.style.width=(q.all?q.done*100/q.all:100)+'%';b.appendChild(i);
    b.addEventListener('click',function(){go(a)});N.appendChild(b)});
  $('totBar').style.width=P.pct+'%';$('totTxt').textContent=P.done+'/'+P.all+'（'+P.pct+'%）';
  $('meTxt').textContent=me.done+'/'+me.all;$('meBar').style.width=(me.all?me.done*100/me.all:100)+'%';
  var Lst=$('list');Lst.innerHTML='';
  (S.tpl[area]||[]).forEach(function(t){
    if(L.isHead(t)){Lst.appendChild(el('div','sec',t.slice(1)));return}
    var k=L.ckey(area,t),rl=L.rule(t),cnt=L.counted(t,S.day.date),c=pend[k]!=null?pend[k]:(S.day.checks[k]||0);
    var r=el('div','it'),b=el('span','b'),tx=el('span','tx',t);r.appendChild(b);r.appendChild(tx);
    function send(v){if(pend[k]!=null)return;pend[k]=v;myLast=Date.now();draw();act({action:'check',area:area,text:t,on:v===2?'na':v===1}).then(function(ok){delete pend[k];if(ok)myLast=Date.now();draw()})}
    if(!rl.opt&&!cnt){r.className='it off';tx.appendChild(el('span','tag','今日は対象外'));Lst.appendChild(r);return}
    if(rl.opt)tx.appendChild(el('span','tag','任意'));
    if(c===2){
      r.className='it off';tx.appendChild(el('span','tag','対象外'));
      var u=el('button','na','戻す');u.addEventListener('click',function(e){e.stopPropagation();send(0)});r.appendChild(u);
    }else{
      if(c===1){r.classList.add('on');b.textContent='✓'}
      r.addEventListener('click',function(){send(c===1?0:1)});
      if(!rl.opt&&c!==1){var n=el('button','na','今日は対象外');n.addEventListener('click',function(e){e.stopPropagation();send(2)});r.appendChild(n)}
    }
    if(pend[k]!=null)r.classList.add('wait');
    Lst.appendChild(r);
  });
  var full=me.done===me.all&&!Object.keys(pend).length;
  $('done').classList.toggle('hide',!full||editing);
  /* 自動で閉じるのは「この窓で最後の1つを押して完了にした」ときだけ。
     開いた時点で完了済み・他のPCが完了させた・0項目 のときは閉じない（勝手に消えるのを防ぐ） */
  if(full&&!wasFull&&myLast&&Date.now()-myLast<4000&&!editing&&window.opener&&!closing){closing=setTimeout(function(){window.close()},2500);$('done').textContent='✓ ここは完了です（自動で閉じます）'}
  if(!full){if(closing){clearTimeout(closing);closing=null}$('done').textContent='✓ ここは完了です'}
  wasFull=full;
}
$('closeBtn').addEventListener('click',function(){window.close();setTimeout(function(){location.href='./'},300)});
$('edBtn').addEventListener('click',function(){if(!S)return;editing=true;$('tx').value=(S.tpl[area]||[]).join('\n');$('ed').classList.remove('hide');$('list').classList.add('hide');$('foot').classList.add('hide');draw()});
function endEdit(){editing=false;$('ed').classList.add('hide');$('list').classList.remove('hide');$('foot').classList.remove('hide');draw()}
$('edCancel').addEventListener('click',endEdit);
$('edSave').addEventListener('click',function(){act({action:'setTpl',area:area,items:$('tx').value}).then(function(ok){if(ok)endEdit()})});
window.addEventListener('storage',function(e){if(e.key==='pbd_mock_db')load()});
load();setInterval(load,BOARD.isMock?2000:5000);
})();
</script>
</body></html>
