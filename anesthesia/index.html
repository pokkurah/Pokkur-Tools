<style>
:root{--mint:#2fa88e;--mint-d:#1f8670;--mint-l:#e6f5f1;--ink:#1f2a2e;--sub:#6b7a80;--line:#e3e8ea;--bg:#f5f7f8;
  --warn:#c0392b;--warn-l:#fdecea;--amber:#9a6200;--amber-l:#fdf3e1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:8px;padding:10px 14px 4px}
.hbar h1{font-size:17px;margin:0;flex:1}
.hbar h1 small{display:block;font-size:11px;color:var(--sub);font-weight:500}
.beta{font-size:11px;font-weight:800;color:#fff;background:var(--amber);border-radius:6px;padding:2px 6px;margin-left:4px;vertical-align:2px}
.src{font-size:11px;color:var(--sub);text-align:right;line-height:1.3}
.src button{border:0;background:none;color:var(--mint-d);font-weight:700;font-size:11px;padding:0}
.pt{display:flex;gap:8px;padding:4px 12px 8px;align-items:center;flex-wrap:wrap}
.pt select{flex:1 1 150px;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 8px;background:#fff;font-weight:700;font-size:16px}
.wt{display:flex;align-items:center;gap:4px;flex:1 1 170px}
.wt input{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;font-size:20px;font-weight:800;text-align:right}
.unit2{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.unit2 button{border:0;background:#fff;min-width:44px;min-height:41px;font-weight:800}
.unit2 button.on{background:var(--mint);color:#fff}
.ptnote{width:100%;font-size:13px;color:var(--sub);padding:0 2px}
.ptnote b{color:var(--ink)}
.tabs{display:flex;gap:6px;padding:0 10px 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:var(--bg);border-radius:9px;padding:8px 12px;font-size:14px;color:var(--sub);font-weight:700}
.tabs button.on{background:var(--mint);color:#fff}
.tabs button.em{color:var(--warn)}
.tabs button.em.on{background:var(--warn);color:#fff}
main{padding:12px 12px 60px;max-width:680px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--mint-d)}
.card h3{font-size:17px;margin:0;line-height:1.3}
.card h3 small{display:block;font-size:12px;color:var(--sub);font-weight:500}
label.f{display:block;font-size:13px;color:var(--sub);margin:12px 0 5px;font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:10px;min-height:42px;padding:0 12px;font-weight:700;font-size:15px}
.seg button.on{background:var(--mint);border-color:var(--mint);color:#fff}
.seg button:disabled{opacity:.35}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1.5px dashed var(--mint);background:#fff;color:var(--mint-d);border-radius:10px;min-height:42px;padding:4px 12px;font-weight:700;font-size:15px;text-align:left}
.pick button.on{border-style:solid;background:var(--mint-l)}
.pick button small{display:block;font-size:11px;font-weight:500;color:var(--sub)}
.row{display:flex;align-items:center;gap:8px}
.row .grow{flex:1}
.din{display:flex;align-items:center;gap:6px;margin-top:6px}
.din input{width:110px;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;font-size:18px;font-weight:800;text-align:right}
.din span{font-weight:700;color:var(--sub)}
.range{font-size:13px;color:var(--sub);margin-top:4px}
.res{margin-top:12px;background:var(--mint-l);border-radius:12px;padding:12px}
.res .big{font-size:30px;font-weight:900;color:var(--mint-d);line-height:1.1;letter-spacing:.01em}
.res .big small{font-size:15px;font-weight:700;color:var(--ink);margin-left:4px}
.res .sub{font-size:14px;color:var(--ink);margin-top:4px}
.res .syr{display:inline-block;font-size:12px;font-weight:800;background:#fff;border:1px solid var(--mint);color:var(--mint-d);border-radius:6px;padding:1px 6px;margin-top:6px}
.res.blocked{background:var(--warn-l)}
.res.blocked .big{font-size:18px;color:var(--warn)}
.steps{margin:10px 0 0;padding:10px 12px;background:#fff;border:1.5px solid var(--amber);border-radius:10px}
.steps b.t{display:block;color:var(--amber);font-size:14px;margin-bottom:4px}
.steps ol{margin:0;padding-left:20px}
.steps li{margin:3px 0}
.steps .key{font-weight:900;font-size:17px;color:var(--mint-d)}
.badge{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;vertical-align:2px;margin-left:4px}
.badge.no{background:var(--warn-l);color:var(--warn)}
.badge.ok{background:var(--mint-l);color:var(--mint-d)}
.alert{border-radius:10px;padding:8px 10px;font-size:14px;margin-top:8px;font-weight:700}
.alert.red{background:var(--warn-l);color:var(--warn)}
.alert.amber{background:var(--amber-l);color:var(--amber)}
.alert.grey{background:var(--bg);color:var(--sub);font-weight:500}
.note{font-size:13px;color:var(--sub);margin-top:6px}
.x{border:0;background:var(--bg);border-radius:8px;min-width:36px;min-height:36px;font-weight:800;color:var(--sub)}
.copy{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px;font-size:14px;font-family:inherit;margin:0}
.btn{border:0;border-radius:10px;min-height:44px;padding:0 16px;font-weight:800;background:var(--mint);color:#fff}
.btn.ghost{background:#fff;color:var(--mint-d);border:1.5px solid var(--mint)}
.empty{text-align:center;color:var(--sub);padding:28px 10px}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:4px}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th,table.tb td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
table.tb th{color:var(--sub);font-weight:700;font-size:12px}
.em-item{border-bottom:1px solid var(--line);padding:10px 0}
.em-item:last-child{border-bottom:0}
.em-item .nm{font-weight:800;font-size:16px}
.em-item .ml{font-size:24px;font-weight:900;color:var(--warn)}
.em-item .ml small{font-size:14px;color:var(--ink);font-weight:700;margin-left:4px}
.bar{height:12px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--mint)}
.bar.amber i{background:var(--amber)} .bar.red i{background:var(--warn)}
.tin{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:16px;background:#fff}
textarea.tin{min-height:70px}
.preview img{width:100%;border:1px solid var(--line);border-radius:6px;margin-top:10px;display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;z-index:50}
</style>
</head>

function parseCSV(t){
  var rows=[],row=[],f="",q=false;
  for(var i=0;i<t.length;i++){var c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===','){row.push(f);f="";} else if(c==='\n'){row.push(f);rows.push(row);row=[];f="";} else if(c!=='\r') f+=c; }

  return rows;
}

    return box;
  }
  box.appendChild(h("div",{class:"big"},fnum(R),h("small",null,"mL/h で流す")));
  if(c.pre10){

    box.appendChild(h("div",{class:"steps"},h("b",{class:"t",text:"⚠ 原液が少量なので、先に10倍液を作ります"}),h("ol",null,

  }else{
    box.appendChild(h("div",{class:"steps",style:"border-color:var(--mint)"},h("ol",null,
      h("li",null,"シリンジに 原液 ",h("span",{class:"key"},fml(c.drugMl)+" mL")," を入れる"),
      h("li",null,diluent(p)," を足して、シリンジの目盛り ",h("span",{class:"key"},fnum(V)+" mL")," に合わせる（",diluent(p),"は約 "+fnum(c.dilMl)+" mL）"),

  var w=kg(), out=[], r=rowsFor(function(r){return r.cat==="拮抗";})[0];
  if(!r) return [h("div",{class:"card empty"},h("b",null,"この動物種の拮抗データがありません"))];
  var p=product(r), dexP=MASTER.filter(function(m){return m.ing==="デクスメデトミジン塩酸塩"&&m.cat!=="局所麻酔";})[0];
  // 前投与タブでデクスを使っていれば自動で入れる
  if(S.rev.dexMl==null){
    S.pre.forEach(function(it){ var rr=rowById(it.id); if(rr&&rr.ing==="デクスメデトミジン塩酸塩"&&tnum(it.ds)!=null&&dexP&&dexP.conc){ var v=vol(bolusMg(tnum(it.ds),rr.u,w),dexP); if(!v.blocked) S.rev.dexMl=fnum(v.ml); } });
  }
  var card=h("div",{class:"card"});
  card.appendChild(h("h3",null,dispName(p,r),vBadge(r),h("small",null,r.ing+"（デクスメデトミジンの拮抗）")));
  card.appendChild(h("label",{class:"f",text:"投与した "+(dexP?dexP.name:"デクスメデトミジン")+" の量（原液のmL）"}));
  card.appendChild(h("div",{class:"din"},numInput(S.rev.dexMl,"revd",function(v){S.rev.dexMl=v;}),h("span",{text:"mL"})));
  card.appendChild(h("div",{class:"note",text:"希釈液で投与した場合は、原液に直したmLを入れてください（10倍液 0.5mL → 原液 0.05mL）"}));
  var dm=tnum(S.rev.dexMl);
  if(dm!=null&&dexP&&dexP.conc){
    var dexMg=dm*dexP.conc, mg=r.d*dexMg;
    card.appendChild(h("div",{class:"range",style:"margin-top:8px",text:"デクス "+fmg(dexMg)+" × "+fnum(r.d)+"倍 ＝ "+fmg(mg)}));
    var hint=null;
    if(p&&p.conc){ var ratio=(mg/p.conc)/dm; hint=h("div",{class:"alert grey",text:Math.abs(ratio-1)<0.01?"目安：デクスと同じ液量です":"目安：デクスの "+fnum(ratio)+" 倍の液量です"}); }
    card.appendChild(volBox(mg,p,hint));
    card.appendChild(h("div",{class:"range",text:"投与経路："+r.route}));
    var v=vol(mg,p);
    if(!v.blocked&&!v.tiny) out.push(card,copyBox("【拮抗】"+ptLine()+"\n・"+dispName(p,r)+"（デクス"+fmg(dexMg)+"の"+fnum(r.d)+"倍）"+fmg(mg)+" = "+(v.f>1?fml(v.dml)+"mL（"+v.f+"倍液）":fml(v.ml)+"mL")+" "+r.route));
    else out.push(card);
  }else out.push(card);
  if(r.note) card.appendChild(h("div",{class:"note",text:"メモ："+r.note}));
  return out;
}

    var r=rowById(it.id); if(!r) return; var p=product(r), d=tnum(it.ds); if(d==null) return;

  });

    if(c.mix){ var mR=criR(c.Rk,w), mV=c.V||autoV(mR), m=mixCalc(c.mix,w,mV,mR);
      D.cri.push({name:"【混合】\n"+m.rows.map(function(x){return dispName(x.p,x.r)+(verified(x.r)?"":"※");}).join("\n"),dose:"\n"+m.rows.map(function(x){return fnum(x.d)+" "+x.r.u;}).join("\n"),
        how:m.blocked?"濃度未登録":m.over?"入りきらない（要確認）":mixText(m,mV,mR,c.Rk,"\n→ ").replace(/＋/g,"\n＋"),rate:fnum(mR)+" mL/h\n（"+c.Rk+"mL/kg/h）",nv:false}); return; }

    var how=x.blocked?"濃度未登録":x.over?"原液のまま "+fml(x.undil)+" mL/h":x.pre10?"10倍液 "+fml(x.drugMl*10)+" mL＋"+diluent(p)+"で "+fnum(V)+" mL":"原液 "+fml(x.drugMl)+" mL＋"+diluent(p)+"で "+fnum(V)+" mL";
    D.cri.push({name:dispName(p,r),dose:fnum(d)+" "+r.u,how:how,rate:x.over?fml(x.undil)+" mL/h":fnum(R)+" mL/h\n（"+c.Rk+"mL/kg/h）",nv:!verified(r)});

  }
  if(S.prt.la) rowsFor(function(r){return r.cat==="局所麻酔";}).forEach(function(r){
    var p=product(r), maxMg=r.cap*w, txt;

  });
  if(S.prt.rev){
    var rr=rowsFor(function(r){return r.cat==="拮抗";})[0];
    var dexP=MASTER.filter(function(m){return m.ing==="デクスメデトミジン塩酸塩"&&m.cat!=="局所麻酔";})[0];
    var dexMg=null; S.pre.forEach(function(it){ var r=rowById(it.id); if(r&&r.ing==="デクスメデトミジン塩酸塩"&&tnum(it.ds)!=null) dexMg=bolusMg(tnum(it.ds),r.u,w); });
    if(rr&&dexMg!=null){ var p=product(rr), mg=rr.d*dexMg; D.rev={name:dispName(p,rr),dose:"デクス"+fmg(dexMg).replace(" ","")+"×"+fnum(rr.d),mg:fmg(mg).replace(" ",""),v:vol(mg,p),route:rr.route,nv:!verified(rr)}; }

    }

}

/* ===== A5 シート描画（canvas → PDF） ===== */
var PFONT='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif';

function pwrap(ctx,text,maxW){
  var lines=[];
  String(text==null?"":text).split("\n").forEach(function(para){
    var cur="";
    for(var i=0;i<para.length;i++){ var t=cur+para[i]; if(ctx.measureText(t).width>maxW&&cur){ lines.push(cur); cur=para[i]; } else cur=t; }
    lines.push(cur);
  });
  return lines;
}

  for(var i=0;i<scales.length;i++){ var r=drawSheet(scales[i]); last=r; if(!r.over) break; }
  SHEET_OVER=last.over;
  return [last.canvas];
}

  if(D.em.length){
    table(R,[{t:"すぐ打つ薬",w:.4},{t:"用量",w:.27},{t:"吸う量",w:.33}],
      D.em.map(function(r){ return [{t:r.name+(r.nv?"※":""),b:true,s:27},{t:r.dose+"\n"+r.route,s:23},{t:r.prep,b:true,s:34,c:RED}]; }),RED);
  }
  if(D.emc.length){
    table(R,[{t:"持続（"+S.cri.Rk+"mL/kg/h）",w:.4},{t:"作り方",w:.4},{t:"流速",w:.2}],
      D.emc.map(function(r){ return [{t:r.name+(r.nv?"※":"")+"\n"+r.dose,b:true,s:25},{t:r.how,s:24},{t:r.rate,b:true,s:30,c:RED}]; }),RED);
  }
  if(!D.em.length&&!D.emc.length) note(R,"（この動物種の緊急薬データがありません）");
  if(D.em.some(function(r){return /倍液/.test(r.prep);})) note(R,"10倍液＝原液0.1mL＋生食0.9mL。100倍液＝10倍液をさらに10倍。",{s:23});
  // 手書き記録欄（残りスペース）
  var rowH=z(54), n=Math.floor((BOTTOM-R.y-z(60))/rowH);
  if(n>=2){
    R.y+=z(6); ctx.font=pf(z(26),800); ctx.fillStyle=RED; ctx.fillText("緊急時の記録",R.x,R.y); R.y+=z(36);
    var cws=[.2,.45,.35].map(function(f){return Math.round(f*R.w);});
    ctx.fillStyle="#fdecea"; ctx.fillRect(R.x,R.y,R.w,z(36)); ctx.font=pf(z(22),700); ctx.fillStyle=RED;
    ["時刻","薬","量・記入者"].forEach(function(t,i){ ctx.fillText(t,R.x+cws.slice(0,i).reduce(function(a,b){return a+b;},0)+z(10),R.y+z(7)); }); R.y+=z(36);
    ctx.fillStyle=LINE;
    for(var j=0;j<Math.min(n,8);j++){ R.y+=rowH; ctx.fillRect(R.x,R.y,R.w,z(2)); }
    var xx=R.x; cws.slice(0,2).forEach(function(ww){ xx+=ww; ctx.fillRect(xx,R.y-rowH*Math.min(n,8),z(2),rowH*Math.min(n,8)); });
  }
  // 中央の区切り線
  ctx.fillStyle=LINE; ctx.fillRect(PM+LW+Math.round(GAP/2),TOP,z(2),Math.max(L.y,R.y)-TOP);
  // フッター
  ctx.font=pf(z(22),500); ctx.fillStyle="#8a979c";
  ctx.fillText("※＝用量が獣医師未確認（β版の下書き）。投与前に必ず獣医師が確認。　作成 "+nowStr(),PM,PH-PM-z(24));
  if(L.y>BOTTOM||R.y>BOTTOM) over=true;
  return {canvas:c,over:over};
}

/* ===== PDF 生成（眼科アプリと同じ方式・依存なし） ===== */
function b64ToBytes(b64){ var bin=atob(b64), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
function strBytes(s){ var u=new Uint8Array(s.length); for(var i=0;i<s.length;i++) u[i]=s.charCodeAt(i)&255; return u; }
function buildPdf(canvases){
  var W=595.28, H=419.53, chunks=[], offset=0, offsets=[];
  function push(u){ chunks.push(u); offset+=u.length; } function pushS(s){ push(strBytes(s)); }
  var n=canvases.length, pageIds=[]; for(var i=0;i<n;i++) pageIds.push(3+i*3);
  pushS("%PDF-1.4\n%\xe2\xe3\xcf\xd3\n");
  offsets[1]=offset; pushS("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
  offsets[2]=offset; pushS("2 0 obj\n<< /Type /Pages /Kids ["+pageIds.map(function(x){return x+" 0 R";}).join(" ")+"] /Count "+n+" >>\nendobj\n");
  canvases.forEach(function(cv,i){
    var pid=3+i*3, cid=pid+1, iid=pid+2, jpg=b64ToBytes(cv.toDataURL("image/jpeg",0.92).split(",")[1]);
    offsets[pid]=offset; pushS(pid+" 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+W+" "+H+"] /Resources << /XObject << /Im0 "+iid+" 0 R >> >> /Contents "+cid+" 0 R >>\nendobj\n");
    var cs="q "+W+" 0 0 "+H+" 0 0 cm /Im0 Do Q";
    offsets[cid]=offset; pushS(cid+" 0 obj\n<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream\nendobj\n");
    offsets[iid]=offset; pushS(iid+" 0 obj\n<< /Type /XObject /Subtype /Image /Width "+cv.width+" /Height "+cv.height+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>\nstream\n");
    push(jpg); pushS("\nendstream\nendobj\n");
  });
  var total=3+n*3, xref=offset, x="xref\n0 "+total+"\n0000000000 65535 f \n";
  for(var k=1;k<total;k++) x+=("0000000000"+offsets[k]).slice(-10)+" 00000 n \n";
  x+="trailer\n<< /Size "+total+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF\n"; pushS(x);
  return new Blob(chunks,{type:"application/pdf"});
}
/* ===== パソコンから直接印刷（A5） ===== */
function printPages(only){
  var pages=renderSheet();
  if(!pages.length) return;
  var old=document.getElementById("printFrame"); if(old) old.remove();
  var f=document.createElement("iframe"); f.id="printFrame";
  f.setAttribute("style","position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden");
  document.body.appendChild(f);
  var d=f.contentWindow.document;
  d.open();
  d.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+pdfName().replace(/\.pdf$/,"")+'</title><style>@page{size:A5 landscape;margin:0}html,body{margin:0;padding:0}img{display:block;width:210mm;height:147.5mm}</style></head><body></body></html>');
  d.close();
  var left=pages.length;
  pages.forEach(function(cv){
    var im=d.createElement("img");
    im.onload=function(){ if(--left===0){ setTimeout(function(){ f.contentWindow.focus(); f.contentWindow.print(); },50); } };
    im.src=cv.toDataURL("image/png"); d.body.appendChild(im);
  });
}
function pdfName(){ var P=S.pt; return [(P.date||today()).replace(/-/g,""),P.no||"番号なし",P.name||"名前なし","麻酔"].join("_").replace(/[\\\/:*?"<>|\s]/g,"")+".pdf"; }
var dl=null;
try{ if(window.claude&&typeof window.claude.use==="function") window.claude.use("downloads").then(function(ns){dl=ns;}).catch(function(){}); }catch(e){}
function savePdf(msgEl){
  var blob=buildPdf(renderSheet()), name=pdfName();
  function ok(t){ msgEl.className="alert grey"; msgEl.textContent=t; } function ng(t){ msgEl.className="alert red"; msgEl.textContent=t; }
  if(dl){ dl.save({filename:name,data:blob}).then(function(){ok("保存しました："+name);}).catch(function(e){ if(e&&e.code==="declined") ng("保存をキャンセルしました。"); else fallback(); }); return; }
  fallback();
  function fallback(){
    try{ var file=new File([blob],name,{type:"application/pdf"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:name}).then(function(){ok("共有しました："+name);}).catch(function(e){ if(e&&e.name==="AbortError") ng("共有をキャンセルしました。"); else anchor(); }); return; }
    }catch(e){}
    anchor();
  }
  function anchor(){ try{ var url=URL.createObjectURL(blob), a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},30000); ok("ダウンロードしました："+name); }catch(e){ ng("この環境では保存できませんでした。"); } }
}

  var c2=h("div",{class:"card"},h("h2",{text:"A5 印刷シート"}));
  c2.appendChild(h("div",{class:"note",text:"載せる内容：症例情報／投与する薬（前投与・導入タブ）／CRI（CRIタブで「印刷シートに追加」したもの）／緊急薬（自動）。下の項目は選べます。"}));
  c2.appendChild(h("div",{class:"seg",style:"margin-top:8px"},[["fl","輸液"],["la","局所麻酔の上限"],["rev","拮抗"]].map(function(k){
    return h("button",{class:S.prt[k[0]]?"on":"",text:(S.prt[k[0]]?"✓ ":"")+k[1],onclick:function(){S.prt[k[0]]=!S.prt[k[0]];renderMain();}});})));

  c2.appendChild(h("div",{style:"margin:12px 0 4px;display:flex;gap:8px;flex-wrap:wrap"},

  c2.appendChild(msg);

function refreshPrint(){
