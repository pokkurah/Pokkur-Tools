<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="麻酔薬計算">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow">
<title>麻酔薬計算 β | ポックル動物病院</title>
<style>
:root{--mint:#2fa88e;--mint-d:#1f8670;--mint-l:#e6f5f1;--ink:#1f2a2e;--sub:#6b7a80;--line:#e3e8ea;--bg:#f5f7f8;
  --warn:#c0392b;--warn-l:#fdecea;--amber:#9a6200;--amber-l:#fdf3e1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:8px;padding:10px 14px 4px}
.hbar h1{font-size:17px;margin:0;flex:1}
.hbar h1 small{display:block;font-size:11px;color:var(--sub);font-weight:500}
.beta{font-size:11px;font-weight:800;color:#fff;background:var(--amber);border-radius:6px;padding:2px 6px;margin-left:4px;vertical-align:2px}
.src{font-size:11px;color:var(--sub);text-align:right;line-height:1.3}
.src button{border:0;background:none;color:var(--mint-d);font-weight:700;font-size:11px;padding:0}
.pt{display:flex;gap:8px;padding:4px 12px 8px;align-items:center;flex-wrap:wrap}
.pt select{flex:1 1 150px;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 8px;background:#fff;font-weight:700;font-size:16px}
.wt{display:flex;align-items:center;gap:4px;flex:1 1 170px}
.wt input{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;font-size:20px;font-weight:800;text-align:right}
.unit2{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.unit2 button{border:0;background:#fff;min-width:44px;min-height:41px;font-weight:800}
.unit2 button.on{background:var(--mint);color:#fff}
.ptnote{width:100%;font-size:13px;color:var(--sub);padding:0 2px}
.ptnote b{color:var(--ink)}
.tabs{display:flex;gap:6px;padding:0 10px 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:var(--bg);border-radius:9px;padding:8px 12px;font-size:14px;color:var(--sub);font-weight:700}
.tabs button.on{background:var(--mint);color:#fff}
.tabs button.em{color:var(--warn)}
.tabs button.em.on{background:var(--warn);color:#fff}
main{padding:12px 12px 60px;max-width:680px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--mint-d)}
.card h3{font-size:17px;margin:0;line-height:1.3}
.card h3 small{display:block;font-size:12px;color:var(--sub);font-weight:500}
label.f{display:block;font-size:13px;color:var(--sub);margin:12px 0 5px;font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:10px;min-height:42px;padding:0 12px;font-weight:700;font-size:15px}
.seg button.on{background:var(--mint);border-color:var(--mint);color:#fff}
.seg button:disabled{opacity:.35}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1.5px dashed var(--mint);background:#fff;color:var(--mint-d);border-radius:10px;min-height:42px;padding:4px 12px;font-weight:700;font-size:15px;text-align:left}
.pick button.on{border-style:solid;background:var(--mint-l)}
.pick button small{display:block;font-size:11px;font-weight:500;color:var(--sub)}
.row{display:flex;align-items:center;gap:8px}
.row .grow{flex:1}
.din{display:flex;align-items:center;gap:6px;margin-top:6px}
.din input{width:110px;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;font-size:18px;font-weight:800;text-align:right}
.din span{font-weight:700;color:var(--sub)}
.range{font-size:13px;color:var(--sub);margin-top:4px}
.res{margin-top:12px;background:var(--mint-l);border-radius:12px;padding:12px}
.res .big{font-size:30px;font-weight:900;color:var(--mint-d);line-height:1.1;letter-spacing:.01em}
.res .big small{font-size:15px;font-weight:700;color:var(--ink);margin-left:4px}
.res .sub{font-size:14px;color:var(--ink);margin-top:4px}
.res .syr{display:inline-block;font-size:12px;font-weight:800;background:#fff;border:1px solid var(--mint);color:var(--mint-d);border-radius:6px;padding:1px 6px;margin-top:6px}
.res.blocked{background:var(--warn-l)}
.res.blocked .big{font-size:18px;color:var(--warn)}
.steps{margin:10px 0 0;padding:10px 12px;background:#fff;border:1.5px solid var(--amber);border-radius:10px}
.steps b.t{display:block;color:var(--amber);font-size:14px;margin-bottom:4px}
.steps ol{margin:0;padding-left:20px}
.steps li{margin:3px 0}
.steps .key{font-weight:900;font-size:17px;color:var(--mint-d)}
.badge{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;vertical-align:2px;margin-left:4px}
.badge.no{background:var(--warn-l);color:var(--warn)}
.badge.ok{background:var(--mint-l);color:var(--mint-d)}
.alert{border-radius:10px;padding:8px 10px;font-size:14px;margin-top:8px;font-weight:700}
.alert.red{background:var(--warn-l);color:var(--warn)}
.alert.amber{background:var(--amber-l);color:var(--amber)}
.alert.grey{background:var(--bg);color:var(--sub);font-weight:500}
.note{font-size:13px;color:var(--sub);margin-top:6px}
.x{border:0;background:var(--bg);border-radius:8px;min-width:36px;min-height:36px;font-weight:800;color:var(--sub)}
.copy{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px;font-size:14px;font-family:inherit;margin:0}
.btn{border:0;border-radius:10px;min-height:44px;padding:0 16px;font-weight:800;background:var(--mint);color:#fff}
.btn.ghost{background:#fff;color:var(--mint-d);border:1.5px solid var(--mint)}
.empty{text-align:center;color:var(--sub);padding:28px 10px}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:4px}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th,table.tb td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
table.tb th{color:var(--sub);font-weight:700;font-size:12px}
.em-item{border-bottom:1px solid var(--line);padding:10px 0}
.em-item:last-child{border-bottom:0}
.em-item .nm{font-weight:800;font-size:16px}
.em-item .ml{font-size:24px;font-weight:900;color:var(--warn)}
.em-item .ml small{font-size:14px;color:var(--ink);font-weight:700;margin-left:4px}
.bar{height:12px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--mint)}
.bar.amber i{background:var(--amber)} .bar.red i{background:var(--warn)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;z-index:50}
</style>
</head>

  <div class="pt" id="pt"></div>

</header>

function parseCSV(t){
  var rows=[],row=[],f="",q=false;
  for(var i=0;i<t.length;i++){var c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===','){row.push(f);f="";} else if(c==='\n'){row.push(f);rows.push(row);row=[];f="";} else if(c!=='\r') f+=c; }

}

      card.appendChild(h("div",{class:"alert amber",text:"院内の濃度（%）が未登録です。使うボトルの%を選んでください"}));
      card.appendChild(h("div",{class:"seg",style:"margin-top:8px"},opts.map(function(o){return h("button",{class:st.pct===o?"on":"",text:o+"%",onclick:function(){st.pct=o;renderMain();}});})));
      pct=st.pct; conc=pct!=null?pct*10:null;
    }
    if(conc!=null){
      card.appendChild(h("div",{class:"sub",style:"margin-top:8px"},fnum(pct)+"%（"+fnum(conc)+" mg/mL）なら 上限は ",h("b",{style:"font-size:20px;color:var(--mint-d)"},fml(maxMg/conc)+" mL")));
      card.appendChild(h("label",{class:"f",text:"使う予定の量"}));
      card.appendChild(h("div",{class:"din"},numInput(st.ml,"la"+key,function(v){st.ml=v;}),h("span",{text:"mL"})));
      var ml=tnum(st.ml);
      if(ml!=null){
        var frac=ml*conc/maxMg; total+=frac;
        card.appendChild(h("div",{class:"sub",style:"margin-top:6px",text:"＝ "+fmg(ml*conc)+"（上限の "+Math.round(frac*100)+"%）"}));
        lines.push("・"+dispName(p,r)+" "+fnum(pct)+"% "+fml(ml)+"mL = "+fmg(ml*conc)+"（上限"+fnum(r.cap)+"mg/kg の"+Math.round(frac*100)+"%）");
      }
    }
    if(r.note) card.appendChild(h("div",{class:"note",text:"メモ："+r.note}));
    out.push(card);
  });
  if(total>0){
    var cls=total>=1?"red":total>=0.8?"amber":"";
    out.push(h("div",{class:"card"},h("h2",{text:"2剤を合わせた使用率"}),
      h("div",{class:"big",style:"font-size:28px;font-weight:900;color:"+(cls==="red"?"var(--warn)":cls==="amber"?"var(--amber)":"var(--mint-d)"),text:Math.round(total*100)+"%"}),
      h("div",{class:"bar "+cls},h("i",{style:"width:"+Math.min(100,total*100)+"%"})),
      total>=1?h("div",{class:"alert red",text:"⚠ 上限を超えています。獣医師に確認してください"}):total>=0.8?h("div",{class:"alert amber",text:"上限に近づいています"}):null,
      h("div",{class:"note",text:"リドカインとマーカインを両方使うときは、それぞれの「上限の%」を足して100%を超えないようにします。"})));
    lines.push("・合計 上限の"+Math.round(total*100)+"%");
    out.push(copyBox(lines.join("\n")));
  }
  return out;
}

/* ===== 緊急薬 ===== */
function renderEm(){
  var w=kg(), rows=rowsFor(function(r){return r.cat==="緊急";});
  if(!rows.length) return [h("div",{class:"card empty"},h("b",null,"この動物種の緊急薬データがありません"))];
  var card=h("div",{class:"card"});
  card.appendChild(h("h2",{style:"color:var(--warn)",text:"緊急薬（標準量） "+ptLine()}));
  rows.forEach(function(r){
    var p=product(r), it=h("div",{class:"em-item"});
    it.appendChild(h("div",{class:"nm"},dispName(p,r),vBadge(r)));
    if(isRate(r.u)){
      it.appendChild(h("div",{class:"range",text:"持続投与 "+fnum(r.d)+" "+r.u+"（10mLシリンジ・1mL/hで作る場合）"}));
      it.appendChild(criResult(r,p,r.d,w,10,1,true));
    }else{
      var mg=bolusMg(r.d,r.u,w), v=vol(mg,p);
      if(v.blocked) it.appendChild(h("div",{class:"alert red",text:"計算できません：濃度が未登録"}));
      else if(v.tiny) it.appendChild(h("div",{class:"alert red",text:"量が少なすぎて正確に測れません（"+fmg(mg)+"）。獣医師に確認"}));
      else{
        it.appendChild(h("div",{class:"ml"},v.f>1?fml(v.dml):fml(v.ml),h("small",null,"mL"+(v.f>1?"（"+v.f+"倍液）":"（原液）")+"　"+r.route)));
        it.appendChild(h("div",{class:"range",text:fnum(r.d)+" "+r.u+" ＝ "+fmg(mg)}));
        if(v.f>1) it.appendChild(h("div",{class:"note",text:v.f===10?"10倍液＝原液0.10mL＋"+diluent(p)+"0.90mL":"100倍液＝10倍液0.10mL＋"+diluent(p)+"0.90mL（10倍液＝原液0.10mL＋"+diluent(p)+"0.90mL）"}));
      }
    }
    if(r.note) it.appendChild(h("div",{class:"note",text:"メモ："+r.note}));
    card.appendChild(it);
  });
  return [card,h("div",{class:"note",text:"量を変えたいときは「前投与・導入」または「CRI」タブで計算できます。"})];
}

/* ===== 拮抗 ===== */
function renderRev(){
  var w=kg(), out=[], r=rowsFor(function(r){return r.cat==="拮抗";})[0];
  if(!r) return [h("div",{class:"card empty"},h("b",null,"この動物種の拮抗データがありません"))];
  var p=product(r), dexP=MASTER.filter(function(m){return m.ing==="デクスメデトミジン塩酸塩"&&m.cat!=="局所麻酔";})[0];
  // 前投与タブでデクスを使っていれば自動で入れる
  if(S.rev.dexMl==null){
    S.pre.forEach(function(it){ var rr=rowById(it.id); if(rr&&rr.ing==="デクスメデトミジン塩酸塩"&&tnum(it.ds)!=null&&dexP&&dexP.conc){ var v=vol(bolusMg(tnum(it.ds),rr.u,w),dexP); if(!v.blocked) S.rev.dexMl=fnum(v.ml); } });
  }
  var card=h("div",{class:"card"});
  card.appendChild(h("h3",null,dispName(p,r),vBadge(r),h("small",null,r.ing+"（デクスメデトミジンの拮抗）")));
  card.appendChild(h("label",{class:"f",text:"投与した "+(dexP?dexP.name:"デクスメデトミジン")+" の量（原液のmL）"}));
  card.appendChild(h("div",{class:"din"},numInput(S.rev.dexMl,"revd",function(v){S.rev.dexMl=v;}),h("span",{text:"mL"})));
  card.appendChild(h("div",{class:"note",text:"希釈液で投与した場合は、原液に直したmLを入れてください（10倍液 0.5mL → 原液 0.05mL）"}));
  var dm=tnum(S.rev.dexMl);
  if(dm!=null&&dexP&&dexP.conc){
    var dexMg=dm*dexP.conc, mg=r.d*dexMg;
    card.appendChild(h("div",{class:"range",style:"margin-top:8px",text:"デクス "+fmg(dexMg)+" × "+fnum(r.d)+"倍 ＝ "+fmg(mg)}));
    var hint=null;
    if(p&&p.conc){ var ratio=(mg/p.conc)/dm; hint=h("div",{class:"alert grey",text:Math.abs(ratio-1)<0.01?"目安：デクスと同じ液量です":"目安：デクスの "+fnum(ratio)+" 倍の液量です"}); }
    card.appendChild(volBox(mg,p,hint));
    card.appendChild(h("div",{class:"range",text:"投与経路："+r.route}));
    var v=vol(mg,p);
    if(!v.blocked&&!v.tiny) out.push(card,copyBox("【拮抗】"+ptLine()+"\n・"+dispName(p,r)+"（デクス"+fmg(dexMg)+"の"+fnum(r.d)+"倍）"+fmg(mg)+" = "+(v.f>1?fml(v.dml)+"mL（"+v.f+"倍液）":fml(v.ml)+"mL")+" "+r.route));
    else out.push(card);
  }else out.push(card);
  if(r.note) card.appendChild(h("div",{class:"note",text:"メモ："+r.note}));
  return out;
}

/* ===== 用量表 ===== */
function renderTb(){
  var o=sp(), out=[];
  var rows=o?rowsFor(function(){return true;}):DOSES;
  var nv=rows.filter(function(r){return !verified(r);}).length;
  out.push(h("div",{class:"card"},h("h2",{text:(o?o.l+" の":"全")+"用量表（"+rows.length+"件）"}),
    nv?h("div",{class:"alert red",text:"未確認 "+nv+"件：獣医師2名の確認後、スプレッドシートの「確認者」「確認日」を記入してください"}):h("div",{class:"alert grey",text:"すべて確認済みです"}),
    h("div",{style:"margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"},
      h("a",{class:"btn ghost",href:SHEET_URL,target:"_blank",rel:"noopener",style:"display:inline-flex;align-items:center;text-decoration:none"},"スプレッドシートを開く"),
      h("button",{class:"btn ghost",text:"再読込",onclick:loadSheet}))));
  var t=h("table",{class:"tb"},h("tr",null,h("th",{text:"薬"}),h("th",{text:"区分・経路"}),h("th",{text:"用量"}),h("th",{text:"確認"})));
  rows.forEach(function(r){
    var p=product(r);
    t.appendChild(h("tr",null,h("td",null,dispName(p,r),o?null:h("div",{class:"note",text:r.sp})),h("td",{text:r.cat+"／"+r.route}),
      h("td",{text:r.cap!=null?"上限 "+fnum(r.cap)+" "+r.u:fnum(r.d)+"（"+fnum(r.min)+"〜"+fnum(r.max)+"）"+r.u}),h("td",null,vBadge(r))));
  });
  out.push(h("div",{class:"card",style:"overflow-x:auto"},t));
  var mm=h("table",{class:"tb"},h("tr",null,h("th",{text:"薬剤マスタ"}),h("th",{text:"濃度"})));
  MASTER.filter(function(m){return m.cat!=="輸液";}).forEach(function(m){ mm.appendChild(h("tr",null,h("td",{text:m.name}),h("td",null,m.conc==null?h("span",{class:"badge no",text:"未登録"}):fnum(m.conc)+" mg/mL"))); });
  out.push(h("div",{class:"card"},mm));
  return out;
}

/* ===== 描画 ===== */
function renderMain(){
  var ae=document.activeElement, fk=ae&&ae.getAttribute&&ae.getAttribute("data-k"), pos=null;
  try{ pos=ae.selectionStart; }catch(e){}
  var app=document.getElementById("app"); app.innerHTML="";
  var parts;
  if(S.tab==="tb") parts=renderTb();
  else{ var np=needPatient(); if(np) parts=[np];
    else parts=({pre:renderPre,cri:renderCri,fl:renderFl,la:renderLa,em:renderEm,rev:renderRev})[S.tab](); }
  parts.forEach(function(x){ if(x) app.appendChild(x); });
  app.appendChild(h("div",{class:"note",style:"text-align:center;margin-top:16px",text:"β版：用量は下書きを含みます。投与前に必ず獣医師が確認してください。"}));
  if(fk&&fk!=="wt"){ var el=app.querySelector('[data-k="'+fk+'"]'); if(el){ el.focus(); try{ if(pos!=null) el.setSelectionRange(pos,pos); }catch(e){} } }
}
function render(){
  var ae=document.activeElement, wtFocus=ae&&ae.getAttribute&&ae.getAttribute("data-k")==="wt";
  renderHeader(); renderMain();
  if(wtFocus){ var w=document.querySelector('[data-k="wt"]'); if(w){ w.focus(); var l=w.value.length; try{w.setSelectionRange(l,l);}catch(e){} } }
}
render(); loadSheet();
})();
</script>
