<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script src="../gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="麻酔記録">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow">
<title>麻酔記録 β | ポックル動物病院</title>
<style>
:root{--mint:#2fa88e;--mint-d:#1f8670;--mint-l:#e6f5f1;--ink:#1f2a2e;--sub:#6b7a80;--line:#e3e8ea;--bg:#f5f7f8;
  --warn:#c0392b;--warn-l:#fdecea;--amber:#9a6200;--amber-l:#fdf3e1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px}
main{max-width:640px;margin:0 auto;padding:10px 12px 120px}
h1{font-size:18px;margin:6px 0 2px;color:var(--mint-d)} h2{font-size:15px;margin:0 0 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.note{font-size:12px;color:var(--sub);line-height:1.5}
.btn{background:var(--mint-d);color:#fff;border:0;border-radius:10px;font-size:15px;padding:10px 14px;font-weight:600}
.btn.big{width:100%;font-size:18px;padding:14px}
.btn.ghost{background:#fff;color:var(--mint-d);border:1px solid var(--mint)}
.btn.red{background:var(--warn)} .btn.sm{font-size:13px;padding:6px 10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;font-size:14px;color:var(--ink);min-height:38px}
.seg button.on{background:var(--mint-d);border-color:var(--mint-d);color:#fff;font-weight:600}
label.f{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
input[type=text],input[type=date],select,textarea{width:100%;font-size:16px;padding:9px;border:1px solid #c9d2d6;border-radius:9px;background:#fff}
textarea{min-height:60px}
.alert{border-radius:10px;padding:9px 11px;font-size:13px;margin:6px 0}
.alert.amber{background:var(--amber-l);color:var(--amber)} .alert.red{background:var(--warn-l);color:var(--warn)} .alert.grey{background:#eef1f2;color:var(--sub)} .alert.mint{background:var(--mint-l);color:var(--mint-d)}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:10px}
.bar .t{font-size:13px;color:var(--sub);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .el{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.bar .nx{font-size:12px;text-align:right;line-height:1.2}
.bar .nx b{font-size:16px;font-variant-numeric:tabular-nums}
.bar .nx.due{color:var(--warn)} .bar .nx.due b{animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.sync{font-size:11px;padding:2px 6px;border-radius:6px;background:#eef1f2;color:var(--sub)} .sync.ng{background:var(--warn-l);color:var(--warn)} .sync.ok{background:var(--mint-l);color:var(--mint-d)}
.vrow{display:flex;align-items:center;gap:6px;padding:7px 0;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0}
.vrow .lb{flex:0 0 92px;font-size:13px;line-height:1.2}
.vrow .lb small{display:block;color:var(--sub);font-size:11px}
.vrow .pm{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:22px;color:var(--mint-d)}
.vrow input.val{flex:1;min-width:0;text-align:center;font-size:24px;font-weight:700;height:46px;padding:0}
.vrow input.val.empty{color:#b9c3c7}
.vrow .same{font-size:11px;padding:4px 6px;border-radius:8px;border:1px dashed var(--mint);background:#fff;color:var(--mint-d);white-space:nowrap}
.vrow .seg{flex:1} .vrow .seg button{padding:7px 8px;font-size:13px;min-height:40px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 4px;font-size:14px;min-height:52px;color:var(--ink);line-height:1.2}
.grid button small{display:block;font-size:11px;color:var(--mint-d);font-weight:700}
.grid button.done{background:var(--mint-l);border-color:var(--mint)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:18px;padding:8px 12px;font-size:13px;color:var(--ink);text-align:left}
.chips button small{color:var(--sub)} .chips button.em{border-color:#f1c4bf;color:var(--warn)}
.chips button.done{background:var(--mint-l);border-color:var(--mint)}
.tl{font-size:13px} .tl div{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line);align-items:flex-start}
.tl div:first-child{border-top:0} .tl .tm{flex:0 0 44px;font-variant-numeric:tabular-nums;color:var(--sub)}
.tl .x{margin-left:auto;border:0;background:none;color:#b9c3c7;font-size:16px;padding:0 4px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;margin-right:4px;background:#eef1f2;color:var(--sub)}
.tag.ev{background:#e8f0fe;color:#1a56b0} .tag.dr{background:#fdf3e1;color:#9a6200} .tag.vt{background:var(--mint-l);color:var(--mint-d)}
pre.copy{white-space:pre-wrap;font-size:13px;background:#f7f9fa;border:1px solid var(--line);border-radius:9px;padding:9px;margin:0;font-family:inherit}
canvas.trend{width:100%;display:block}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1f2a2e;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .sh{background:#fff;width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:14px;max-height:92vh;overflow:auto}
.trow{display:flex;align-items:center;gap:6px;justify-content:center;margin:4px 0 8px}
.trow b{font-size:20px;font-variant-numeric:tabular-nums;min-width:64px;text-align:center}
.preview img{width:100%;border:1px solid var(--line);margin-top:8px}
.floatbtn{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(245,247,248,.95);border-top:1px solid var(--line);z-index:6}
.floatbtn .btn{max-width:616px;margin:0 auto;display:block}

/* ===== 大画面表示 ===== */
body.disp{background:#0d1417;color:#e8eef0;overflow:hidden}
body.disp main{display:none}
#D{display:none}
body.disp #D{display:grid;height:100vh;grid-template-rows:auto 1fr;grid-template-columns:1fr 340px;gap:10px;padding:12px 16px}
.dh{grid-column:1/3;display:flex;align-items:center;gap:18px;border-bottom:1px solid #26363c;padding-bottom:10px}
.dh .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.dh .ctl{display:flex;align-items:center;gap:10px}
body.disp{--tz:8.5vh}
body.disp.bigt{--tz:15vh}
.tmr{display:flex;gap:14px;flex:0 0 auto}
.tb{border-radius:16px;padding:6px 20px 10px;text-align:right;line-height:1}
.tb .lb{font-size:calc(var(--tz)*0.3);font-weight:700;display:flex;justify-content:space-between;gap:14px;margin-bottom:4px}
.tb .lb small{font-weight:600;opacity:.85}
.tb .tv{font-size:var(--tz);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tb.an{background:#0c3a31;border:3px solid #2fd3a8;color:#5ff0c6}
.tb.cut{background:#432808;border:3px solid #ff9f2e;color:#ffb547}
.tb.off{opacity:.4}
.tb.stop .tv{opacity:.75}
.dh .who{font-size:30px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh .who small{font-size:20px;color:#9fb3b9;font-weight:500;margin-left:12px}
.dh .el{margin-left:auto;font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;color:#7fe0c4}
.dh .el small{font-size:16px;color:#9fb3b9;margin-right:6px;font-weight:500}
.dh .clk{font-size:22px;color:#9fb3b9;font-variant-numeric:tabular-nums}
#Dg{position:relative;min-height:0}
#Dg canvas{width:100%;height:100%;display:block}
.ds{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden}
.tile{background:#152126;border-radius:12px;padding:8px 12px;display:flex;align-items:baseline;gap:8px}
.tile .l{font-size:15px;color:#9fb3b9;flex:0 0 96px}
.tile .v{font-size:42px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05;margin-left:auto}
.tile .u{font-size:13px;color:#9fb3b9;flex:0 0 46px}
.tile.y{background:#3a2e10} .tile.y .v{color:#ffcc4d}
.tile.r{background:#4a1714} .tile.r .v{color:#ff7466;animation:bl 1.2s infinite}
.dnext{background:#152126;border-radius:12px;padding:8px 12px;font-size:16px;color:#9fb3b9}
.dnext b{font-size:26px;color:#e8eef0;font-variant-numeric:tabular-nums;margin-left:8px}
.dnext.due{background:#4a1714} .dnext.due b{color:#ff7466}
.dlog{background:#152126;border-radius:12px;padding:8px 12px;font-size:15px;flex:1;min-height:0;overflow:hidden}
.dlog div{padding:3px 0;border-top:1px solid #22323a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlog div:first-child{border-top:0}
.dlog .tm{color:#9fb3b9;margin-right:8px;font-variant-numeric:tabular-nums}
.dmsg{grid-column:1/3;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-size:22px;color:#9fb3b9}
.dmsg button{font-size:20px;padding:14px 22px;border-radius:12px;border:1px solid #2fa88e;background:#152126;color:#e8eef0;min-width:420px;text-align:left}
.dmsg input{font-size:22px;padding:10px;border-radius:10px;border:1px solid #2fa88e;background:#152126;color:#fff;text-align:center}
.dwarn{position:fixed;left:16px;bottom:16px;background:#4a1714;color:#ffb3aa;padding:8px 18px;border-radius:10px;font-size:18px;display:none}
</style>
</head>
<body>
<main id="M"></main>
<div id="D"></div>
<div class="dwarn" id="Dw"></div>
<div id="Dsnd" style="display:none;position:fixed;right:16px;bottom:16px;background:#3a2e10;color:#ffcc4d;padding:10px 16px;border-radius:10px;font-size:18px;cursor:pointer">🔈 画面を1回クリックすると記録時刻の音が鳴るようになります</div>
<script>
(function(){
"use strict";

/* ====== 設定 ====== */
var REC_API="https://script.google.com/macros/s/AKfycbwjFCXqUR0_LI4iJ4ZBV0z70TJRcNe6XUvcyE2qK_cRMYlnwQ-ECfo-i0LThozrQgSfYA/exec";   /* Apps Script のウェブアプリURL。空のあいだは試験モード（この端末だけ。大画面表示は同じ端末の別タブでのみ確認可） */
var KEEP_DAYS=5;  /* サーバーの記録は5日で自動削除（PDFをARMIXに残すのが正本） */
var VETS=["伊村","伊村晶子","蒲原","榮藤","柿本","山田"];
var ASA=["I","II","III","IV","V"];
var AGENTS=["イソフルラン","セボフルラン","なし（注射のみ）"];

var SPECIES=[
 {l:"犬",g:"dc"},{l:"猫",g:"dc"},{l:"ウサギ",g:"rb"},{l:"フェレット",g:"rb"},
 {l:"モルモット",g:"sm"},{l:"チンチラ",g:"sm"},{l:"デグー",g:"sm"},{l:"ハムスター",g:"sm",small:1},{l:"マウス",g:"sm",small:1},{l:"ラット",g:"sm",small:1},{l:"ハリネズミ",g:"sm",small:1},
 {l:"小鳥・インコ類",g:"bd",small:1},{l:"猛禽",g:"bd"},
 {l:"トカゲ",g:"rp"},{l:"ヤモリ",g:"rp",small:1},{l:"カメ",g:"rp"},{l:"ヘビ",g:"rp"},
 {l:"カエル",g:"am",small:1},{l:"イモリ",g:"am",small:1},{l:"サンショウウオ",g:"am",small:1}
];
var GROUP_NAME={dc:"犬・猫",rb:"ウサギ・フェレット",sm:"げっ歯類・ハリネズミ",bd:"鳥類",rp:"爬虫類",am:"両生類"};
function spObj(l){ for(var i=0;i<SPECIES.length;i++) if(SPECIES[i].l===l) return SPECIES[i]; return null; }

/* モニター項目。num：−/＋とキー入力、sel：選択 */
var ITEMS=[
 {k:"hr",l:"心拍数",u:"bpm",t:"num",st:5,dp:0,c:"#e5484d"},
 {k:"rr",l:"呼吸数",u:"/分",t:"num",st:1,dp:0,c:"#3b82f6"},
 {k:"spo2",l:"SpO₂",u:"%",t:"num",st:1,dp:0,c:"#14b8a6",mx:100},
 {k:"etco2",l:"EtCO₂",u:"mmHg",t:"num",st:1,dp:0,c:"#f59e0b"},
 {k:"sys",l:"血圧 収縮期",u:"mmHg",t:"num",st:5,dp:0,c:"#d946ef",grp:"nibp"},
 {k:"map",l:"血圧 平均",u:"mmHg",t:"num",st:5,dp:0,c:"#a855f7",grp:"nibp"},
 {k:"dia",l:"血圧 拡張期",u:"mmHg",t:"num",st:5,dp:0,c:"#c084fc",grp:"nibp"},
 {k:"dop",l:"ドップラー血圧",u:"mmHg",t:"num",st:5,dp:0,c:"#ec4899"},
 {k:"temp",l:"体温",u:"℃",t:"num",st:0.1,dp:1,c:"#ef7d2d"},
 {k:"agent",l:"吸入濃度",u:"%",t:"num",st:0.25,dp:2,c:"#64748b"},
 {k:"o2",l:"酸素流量",u:"L/分",t:"num",st:0.1,dp:1,c:"#94a3b8"},
 {k:"fluid",l:"輸液速度",u:"mL/h",t:"num",st:1,dp:1,c:"#0ea5e9"},
 {k:"ecg",l:"心電図",t:"sel",o:["洞調律","洞性頻脈","洞性徐脈","VPC","AVブロック","その他"]},
 {k:"reflex",l:"反射",sub:"眼瞼・趾間・立ち直り",t:"sel",o:["＋","±","−"]},
 {k:"jaw",l:"顎の緊張",t:"sel",o:["あり","弱い","なし"]},
 {k:"mm",l:"粘膜色",t:"sel",o:["ピンク","淡","チアノーゼ","充血"]},
 {k:"crt",l:"CRT",t:"sel",o:["2秒未満","2秒以上"]},
 {k:"vent",l:"換気",t:"sel",o:["自発","補助","調節(IPPV)"]}
];
var IT={}; ITEMS.forEach(function(x){ IT[x.k]=x; });
/* 動物種ごとの初期項目（端末に前回の選択を覚える） */
var DEF_ITEMS={
 dc:["hr","rr","spo2","etco2","sys","map","dia","temp","agent","o2","ecg","reflex","mm"],
 rb:["hr","rr","spo2","etco2","dop","temp","agent","o2","reflex","mm"],
 sm:["hr","rr","spo2","temp","agent","o2","reflex"],
 bd:["hr","rr","etco2","dop","temp","agent","o2","reflex","vent"],
 rp:["hr","rr","temp","agent","o2","reflex","vent"],
 am:["hr","rr","temp","reflex"]
};
var EVENTS=["麻酔導入","挿管","吸入開始","手術開始","手術終了","吸入終了","抜管","覚醒（伏臥位）","体位変換","低血圧対応","不整脈","嘔吐・逆流","呼吸停止","その他"];
var EV_ONCE=["麻酔導入","挿管","吸入開始","手術開始","手術終了","吸入終了","抜管","覚醒（伏臥位）"];
var EM_DEFAULT=["アドレナリン","アトロピン","グリコピロレート","エフェドリン","ドパミン","ドブタミン","静注用キシロカイン","ドプラム"];

/* ====== 小道具 ====== */
function h(tag,attrs){var el=document.createElement(tag);if(attrs)for(var a in attrs){var v=attrs[a];if(v==null||v===false)continue;if(a==="class")el.className=v;else if(a==="text")el.textContent=v;else if(a.slice(0,2)==="on")el.addEventListener(a.slice(2),v);else el.setAttribute(a,v===true?"":v);}
 for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null||c===false)continue;(Array.isArray(c)?c:[c]).forEach(function(x){if(x!=null&&x!==false)el.appendChild(typeof x==="string"||typeof x==="number"?document.createTextNode(String(x)):x);});}return el;}
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function tnum(v){ v=String(v==null?"":v).replace(/[,，\s]/g,""); return v===""||isNaN(+v)?null:+v; }
function p2(n){ return ("0"+n).slice(-2); }
function hm(t){ var d=new Date(t); return d.getHours()+":"+p2(d.getMinutes()); }
function ymd(t){ var d=t?new Date(t):new Date(); return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); }
function dur(ms){ if(ms<0) ms=0; var m=Math.floor(ms/60000), s=Math.floor(ms/1000)%60; return m>=60?Math.floor(m/60)+":"+p2(m%60)+":"+p2(s):m+":"+p2(s); }
function mins(ms){ return Math.round(ms/60000); }
function fv(k,v){ var x=IT[k]; if(v==null||v==="") return "—"; if(!x||x.t!=="num") return String(v); return (+v).toFixed(x.dp); }
function toast(t){ var d=h("div",{class:"toast",text:t}); document.body.appendChild(d); setTimeout(function(){d.remove();},1800); }
function uid(){ return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-6); }
function apiKey(){ try{ return localStorage.getItem("anes_key")||localStorage.getItem("rcb_key")||""; }catch(e){ return ""; } }
function grpOf(R){ var o=spObj(R.sp); return o?o.g:"dc"; }

/* ====== 記録データ（端末に一時保存：電源切れ・誤操作でも消えないように。終了後に消去） ====== */
var R=null, SYNC={st:"",at:0,timer:null,busy:false,again:false};
function localIds(){ return lsGet("anrec_ids")||[]; }
function saveLocal(){
  if(!R) return;
  lsSet("anrec_r_"+R.id,R);
  var ids=localIds(); if(ids.indexOf(R.id)<0){ ids.push(R.id); lsSet("anrec_ids",ids); }
  try{ if(window.BroadcastChannel){ new BroadcastChannel("anrec").postMessage(R.id); } }catch(e){}
}
function dropLocal(id){ lsDel("anrec_r_"+id); lsSet("anrec_ids",localIds().filter(function(x){return x!==id;})); }
function cleanLocal(){ /* KEEP_DAYS を過ぎた端末内の記録は消す */
  var lim=Date.now()-KEEP_DAYS*864e5;
  localIds().forEach(function(id){ var r=lsGet("anrec_r_"+id); if(!r||(r.updated||0)<lim) dropLocal(id); });
}
function touch(){ R.rev=(R.rev||0)+1; R.updated=Date.now(); saveLocal(); queuePush(); }

/* ====== サーバー ====== */
function api(p){
  if(!REC_API) return Promise.reject(new Error("test"));
  p.k=apiKey();
  var req=(p.action==="list"||p.action==="get")?fetch(REC_API+"?"+new URLSearchParams(p).toString(),{cache:"no-store"})
    :fetch(REC_API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)});
  return req.then(function(r){return r.json();}).then(function(j){ if(!j.ok&&j.err==="auth") j.err="院内キーが違います（受付ボードと同じキー）"; return j; });
}
function meta(r){ return {id:r.id,rev:r.rev,status:r.status,date:r.pt.date,no:r.pt.no,name:r.pt.name,sp:r.sp,proc:r.pt.proc,vet:r.pt.vet,updated:r.updated}; }
function queuePush(){
  if(!REC_API){ SYNC.st="test"; paintSync(); return; }
  clearTimeout(SYNC.timer); SYNC.timer=setTimeout(push,700);
}
function push(){
  if(!R) return;
  if(SYNC.busy){ SYNC.again=true; return; }
  SYNC.busy=true; var rev=R.rev;
  var m=meta(R); m.action="put"; m.data=JSON.stringify(R);
  api(m).then(function(j){ SYNC.busy=false; if(j.ok){ SYNC.st="ok"; SYNC.at=Date.now(); R.pushed=rev; lsSet("anrec_r_"+R.id,R); } else { SYNC.st="ng"; SYNC.err=j.err; }
    paintSync(); if(SYNC.again||(R&&R.rev>rev)){ SYNC.again=false; queuePush(); } })
  .catch(function(){ SYNC.busy=false; SYNC.st="ng"; SYNC.err="通信できません"; paintSync(); clearTimeout(SYNC.timer); SYNC.timer=setTimeout(push,8000); });
}
setInterval(function(){ if(R&&REC_API&&R.status!=="setup"&&(R.pushed||0)<(R.rev||0)&&!SYNC.busy) push(); },15000);
function paintSync(){
