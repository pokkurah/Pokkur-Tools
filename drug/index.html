<html lang="ja">
<head>
<meta charset="utf-8">

<title>エキゾ薬剤計算 β | ポックル動物病院</title>
<style>
:root{--mint:#2fa88e;--mint-d:#1f8670;--mint-l:#e6f5f1;--ink:#1f2a2e;--sub:#6b7a80;--line:#e3e8ea;--bg:#f5f7f8;
  --warn:#c0392b;--warn-l:#fdecea;--amber:#9a6200;--amber-l:#fdf3e1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:8px;padding:10px 14px 6px}
.hbar h1{font-size:17px;margin:0;flex:1}
.hbar h1 small{display:block;font-size:11px;color:var(--sub);font-weight:500}
.beta{font-size:11px;font-weight:800;color:#fff;background:var(--amber);border-radius:6px;padding:2px 6px;margin-left:4px;vertical-align:2px}
.tabs{display:flex;gap:6px;padding:0 10px 8px}
.tabs button{flex:1;border:0;background:var(--bg);border-radius:9px;padding:8px;font-size:13px;color:var(--sub);font-weight:700}
.tabs button.on{background:var(--mint);color:#fff}
main{padding:12px 12px 40px;max-width:680px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--mint-d)}
label.f{display:block;font-size:13px;color:var(--sub);margin:12px 0 5px;font-weight:700}
label.f:first-of-type{margin-top:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:10px;min-height:42px;padding:0 12px;font-weight:700;font-size:15px}
.seg button.on{background:var(--mint);border-color:var(--mint);color:#fff}
.seg.prep button{flex:1;min-height:52px;font-size:17px}
.seg.sp button{min-width:calc(25% - 5px);padding:0 6px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inbox{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:46px;background:#fff}
.inbox input{border:0;width:100%;font-size:20px;font-weight:800;padding:6px 0;background:transparent;min-width:0}
.inbox input:focus{outline:none}
.inbox .u{font-size:13px;color:var(--sub);white-space:nowrap;margin-left:6px}
.inbox.req{border-color:var(--warn);background:var(--warn-l)}
select.t{width:100%;border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:46px;background:#fff;font-size:17px;font-weight:700}
.drug{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.dh{display:flex;align-items:flex-start;gap:8px}
.dh .nm{flex:1;font-weight:800;font-size:16px}
.dh .nm small{display:block;font-weight:500;font-size:12px;color:var(--sub)}
.x{border:1px solid var(--line);background:#fff;border-radius:9px;width:34px;height:34px;font-size:16px;color:var(--sub)}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.mini button{border:1px solid var(--line);background:#fff;border-radius:8px;min-height:34px;padding:0 10px;font-size:13px;font-weight:700}
.mini button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.ref{font-size:12px;color:var(--sub);margin-top:5px}
.ref b{color:var(--ink)}
.res{margin-top:10px;background:var(--mint-l);border-radius:10px;padding:10px 12px}
.res .big{font-size:24px;font-weight:900;color:var(--mint-d);letter-spacing:.01em}
.res .sm{font-size:13px;color:var(--ink);margin-top:2px}
.warn{margin-top:8px;font-size:13px;font-weight:700;color:var(--warn);background:var(--warn-l);border-radius:8px;padding:7px 10px}
.caut{margin-top:8px;font-size:13px;font-weight:700;color:var(--amber);background:var(--amber-l);border-radius:8px;padding:7px 10px}
.draft{display:inline-block;font-size:11px;font-weight:800;color:var(--amber);background:var(--amber-l);border-radius:5px;padding:1px 6px;margin-left:4px}
.add{display:flex;gap:8px}
.add select{flex:1}
.add button{border:0;background:var(--mint);color:#fff;border-radius:10px;padding:0 16px;font-weight:800;min-height:46px}
pre.karte{white-space:pre-wrap;word-break:break-all;font-family:inherit;font-size:15px;background:var(--bg);border-radius:10px;padding:12px;margin:0 0 10px;line-height:1.6}
.copy{width:100%;border:0;background:var(--mint);color:#fff;border-radius:12px;min-height:50px;font-weight:900;font-size:16px}
.copied{text-align:center;font-size:13px;color:var(--mint-d);font-weight:700;min-height:20px;margin-top:6px}
.veh{font-size:14px;margin-top:8px;color:var(--ink)}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th,table.dt td{border-bottom:1px solid var(--line);padding:7px 4px;text-align:left;vertical-align:top}
table.dt th{color:var(--sub);font-size:12px}
table.dt td.na{color:#b5bfc3}
.hint{font-size:12px;color:var(--sub);margin:6px 2px 0}
.ok{display:inline-block;font-size:11px;font-weight:800;color:var(--mint-d);background:var(--mint-l);border-radius:5px;padding:1px 6px;margin-left:4px}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mint-d);background:var(--mint-l);border-radius:10px;padding:6px 6px 6px 12px;margin-bottom:10px;font-weight:700}
.status.off{color:var(--amber);background:var(--amber-l)}
.status span{flex:1}
.status button{border:1px solid currentColor;background:#fff;color:inherit;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:800}
a.open{display:block;text-align:center;background:var(--mint);color:#fff;text-decoration:none;font-weight:800;border-radius:10px;padding:12px;margin-top:8px}
.seg.imode{margin-bottom:12px}.seg.imode button{flex:1;min-height:46px}
.vcard{border-color:var(--mint)}
textarea.vin{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;font-family:inherit}
.vrow{display:flex;gap:8px;margin-top:8px}
.vbtn{flex:1;min-height:46px;border:0;border-radius:10px;background:var(--mint);color:#fff;font-weight:800;font-size:15px}
.vbtn.alt{background:var(--ink)}.vbtn.ghost{background:#fff;border:1px solid var(--line);color:var(--sub);flex:0 0 70px}
.vres{margin-top:10px;background:var(--bg);border-radius:10px;padding:10px 12px}
.vh{font-size:12px;font-weight:800;color:var(--mint-d);margin-bottom:6px}
.vr{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0;border-bottom:1px dashed var(--line)}
.vr span{color:var(--sub)}
.clear{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;min-height:46px;font-weight:800;color:var(--sub);margin-top:4px}
</style>
</head>

function tnum(v){ v=String(v==null?"":v).trim(); return v===""||isNaN(+v)?null:+v; }
function buildData(master, doses){
  var drugs=[], dmap={}, ings=[];
  master.forEach(function(r){
    var name=String(r[0]||"").trim(); if(!name) return;
    var formJ=String(r[2]||"").trim(), form=formJ==="液"?"liq":formJ==="散"?"pow":formJ==="量指定"?"fixed":"tab", cap=formJ==="カプセル";

    if(form!=="fixed" && !str.length) return;
    var tw=String(r[7]||"").split(/[,、，\s]+/).map(tnum);
    var ali=String(r[9]||"").split(/[,、，\s]+/).map(function(x){return x.trim();}).filter(function(x){return x;});
    var only=String(r[8]||"").split(/[,、，\s]+/).map(function(x){return x.trim();}).filter(function(x){return x;});
    drugs.push({id:name,name:name,ing:ing,form:form,cap:cap,only:only,ali:ali,str:str,tw:tw,unit:String(r[4]||"").trim()||"個",per5:tnum(r[5])||1,note:String(r[6]||"").trim()});
    if(ing && ings.indexOf(ing)<0) ings.push(ing);
  });
  doses.forEach(function(r){
    var ing=String(r[0]||"").trim(), sp=SP_BY_NAME[String(r[1]||"").trim()], d=tnum(r[2]);
    if(!ing||!sp||d===null) return;
    var mn=tnum(r[3]), mx=tnum(r[4]);
    (dmap[ing]=dmap[ing]||{})[sp]={d:d,min:mn,max:mx,f:String(r[5]||"").trim(),

  });

}
function parseCSV(t){
  var rows=[],row=[],f="",q=false;
  for(var i=0;i<t.length;i++){var c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===','){row.push(f);f="";} else if(c==='\n'){row.push(f);rows.push(row);row=[];f="";} else if(c!=='\r') f+=c; }
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows;
}

var SP_ALIAS={rabbit:["ウサギ","兎","ラビット"],hamster:["ハムスター","ハム"],mouse:["マウス"],rat:["ラット"],guineapig:["モルモット"],
  chinchilla:["チンチラ"],degu:["デグー","デグ"],hedgehog:["ハリネズミ"],bird:["鳥","トリ","インコ","セキセイ","オカメ","文鳥","ブンチョウ","オウム","フィンチ"],
  lizard:["トカゲ","フトアゴ"],gecko:["ヤモリ","レオパ","ヒョウモン"],turtle:["カメ","亀","リクガメ"],snake:["ヘビ","蛇"],newt:["イモリ"]};
var FREQ_ALIAS=[["SID",["SID","シッド","1日1回","一日一回","1日一回"]],["BID",["BID","ビッド","ビーアイディー","1日2回","一日二回","1日二回"]],
  ["TID",["TID","ティッド","1日3回","一日三回","1日三回"]],["EOD",["EOD","隔日","1日おき"]]];
function kana(t){ return t.replace(/[ぁ-ゖ]/g,function(c){return String.fromCharCode(c.charCodeAt(0)+0x60);}); }
function normVoice(t){
  t=kana(String(t||"").normalize("NFKC"));

  t=t.replace(/ミリリットル|ml|ML|cc|CC/g,"mL").replace(/ミリグラム/g,"mg").replace(/グラム/g,"g").replace(/キログラム|キロ/g,"kg");

}
function parseVoice(text){
  var t=normVoice(text), toks=[], used=[];
  var pats=[];
  function add(word,type,val){ pats.push({w:kana(word.normalize("NFKC")),type:type,val:val}); }
  add("液剤","prep","liq"); add("水剤","prep","liq"); add("散剤","prep","pow"); add("粉薬","prep","pow"); add("粉","prep","pow");
  add("半シロ","veh","half"); add("ハンシロ","veh","half"); add("水のみ","veh","water"); add("水","veh","water");
  add("全量","total",1); add("総量","total",1);
  FREQ_ALIAS.forEach(function(f){ f[1].forEach(function(w){ add(w,"freq",f[0]); }); });
  Object.keys(SP_ALIAS).forEach(function(k){ SP_ALIAS[k].forEach(function(w){ add(w,"sp",k); }); });
  var stemCount={};
  DRUGS.forEach(function(d){ var st=d.name.replace(/(錠|カプセル|シロップ|配合顆粒)$/,""); stemCount[st]=(stemCount[st]||0)+1; });
  DRUGS.forEach(function(d){
    var names=[d.name].concat(d.ali||[]);
    var stem=d.name.replace(/(錠|カプセル)$/,""); if(stem!==d.name) names.push(stem);
    var st2=d.name.replace(/(シロップ|配合顆粒)$/,""); if(st2!==d.name && stemCount[st2]===1) names.push(st2);
    if(d.ing && d.form!=="fixed") names.push(d.ing);
    names.forEach(function(n){ if(n) add(n,"drug",d.id); });
  });
  pats.sort(function(a,b){ return b.w.length-a.w.length; });
  var i=0, unk="";
  var FILLER=/^(ト|デ|ヲ|ニ|ノ|ハ|ガ|アト|ソレカラ|プラス|エート|エーット|エー|アノ|アノー|ンー|マズ|ツギ)$/;
  function flush(){ var w=unk.trim(); unk=""; if(!w) return; if(FILLER.test(w)) return; used.push(w); toks.push({type:"unk",raw:w}); }
  while(i<t.length){
    var c=t[i];
    if(/[\s、。，,・]/.test(c)){ flush(); i++; continue; }
    var hit=null;
    for(var k=0;k<pats.length;k++){ if(t.substr(i,pats[k].w.length)===pats[k].w){ hit=pats[k]; break; } }
    if(hit){ flush(); toks.push({type:hit.type,val:hit.val,raw:hit.w}); i+=hit.w.length; continue; }
    var m=/^(\d+(?:\.\d+)?)\s*(mg\/kg|mg\/頭\/日|mg\/頭|mg|kg|mL|g|日分|日|包|錠|カプセル|個)?/.exec(t.substr(i));
    if(m){ flush(); toks.push({type:"num",val:+m[1],unit:m[2]||"",raw:m[0]}); i+=m[0].length; continue; }

    if(tk.type==="unk"){ if(stage==="drug"){ cur=null; stage="lost"; } return; }
    if(tk.type==="prep"){ out.prep=tk.val; return; }
    if(tk.type==="sp"){ out.sp=tk.val; stage="wt"; return; }
    if(tk.type==="freq"){ out.freq=tk.val; stage="after_freq"; return; }
    if(tk.type==="veh"){ out.veh=tk.val; return; }
    if(tk.type==="total"){ nextTotal=true; return; }
    if(tk.type==="drug"){ cur={id:tk.val,nums:[]}; out.items.push(cur); stage="drug"; return; }
    if(tk.type==="num"){
      var v=tk.val,u=tk.unit;

      if(nextTotal){ out.total=v; nextTotal=false; return; }
      if(u==="kg"){ out.wt=v*1000; return; }
      if(stage==="wt" || (u==="g" && !out.wt && stage!=="after_freq" && stage!=="after_freq2" && stage!=="after_freq3")){ out.wt=v; stage="after_wt"; return; }
      var prep=out.prep||S.prep||"liq";
      if(u==="日分"||u==="日"){ out.days=v; stage="after_freq2"; return; }
      if(u==="包"){ out.pack=v; return; }
      if(stage==="after_freq"){ if(prep==="pow"){ out.days=v; } else { out.per=v; } stage="after_freq2"; return; }
      if(stage==="after_freq2"){ if(prep==="pow"){ out.pack=v; } else { out.total=v; } stage="after_freq3"; return; }
      out.unknown.push(tk.raw);

}
function applyVoice(o){
  var notes=[];

  if(o.freq) S.freq=o.freq;
  if(o.per) S.per=o.per;
  if(o.total){ S.total=Math.min(10,Math.max(1,Math.round(o.total))); if(S.total!==o.total) notes.push("総液量は1〜10mLの整数に丸めました"); }

/* ===== 計算 ===== */
function packs(){ var n=+S.days||0; return S.freq==="EOD" ? Math.ceil(n/2) : n*(PER_DAY[S.freq]||1); }
function powWeight(r){ // 散剤に入る粉の重さ(g)。不明ならnull
  var d=r.d, it=r.it;
  if(d.form==="pow") return r.qty;
  if(d.form==="tab"){ var w=d.tw&&d.tw[it.si]; return (w!=null&&w>0) ? r.qty*w/1000 : null; }
  if(d.form==="fixed"){ var w2=d.tw&&d.tw[0]; return (w2!=null&&w2>0) ? r.qty*w2/1000 : null; }
  return null;
}
function calcItem(it){
  var d=drug(it.id), r={d:d,it:it};
  var tot=+S.total;
  if(S.prep==="pow"){
    if(it.mode==="fixed"){ r.qty=num(it.fixed)?+it.fixed:NaN; r.ok=num(it.fixed); r.unit=unitOf(d); r.liqMl=0; return r; }
    var u0=it.unit||"mg/kg";
    r.ok=(u0!=="mg/kg"||(num(S.wt)&&+S.wt>0))&&num(it.dose)&&+it.dose>0&&packs()>0;
    if(!r.ok) return r;
    r.mgDose = u0==="mg/kg" ? +it.dose*(+S.wt/1000) : u0==="mg/頭" ? +it.dose : +it.dose/(PER_DAY[S.freq]||1);
    r.mgTotal = r.mgDose*packs(); r.qty=r.mgTotal/d.str[it.si]; r.unit=unitOf(d); r.liqMl=0;
    return r;
  }
  if(it.mode==="fixed"){
    var q=num(it.fixed)?+it.fixed:NaN;
    r.qty=q*tot/5; r.ok=num(it.fixed);
    r.unit = unitOf(d);
    r.liqMl = d.form==="liq" ? r.qty : 0;
    return r;

  if(!r.ok) return r;
  r.mgDose = u==="mg/kg" ? dose*wt : u==="mg/頭" ? dose : dose/(PER_DAY[S.freq]||1);  // 1回量 mg

function filler(results){

    res.appendChild(h("div",{class:"vres"},h("div",{class:"vh",text:"読み取り結果（下の入力欄に反映済み。必ず確認してください）"}),rows,
      (o.notes&&o.notes.length)?h("div",{class:"caut",text:o.notes.join("／")}):null,
      (o.unknown&&o.unknown.length)?h("div",{class:"warn",text:"聞き取れなかった語："+o.unknown.join("、")}):null));
  }
  return h("div",{class:"card vcard"},
    h("h2",{text:"音声でまとめて入力"}),
    h("p",{class:"hint",style:"margin:-4px 0 8px",text:"話す順番：剤形 → 動物種 → 体重 → 回数 → 液剤なら「1回量 → 総液量 → 溶解液」／散剤なら「日数 → 1包の重さ」→ 薬と用量（薬の後に数字）"}),
    ta,
    h("div",{class:"vrow"}, mic,
      h("button",{class:"vbtn",text:"読み取る",onclick:function(){
        var o=parseVoice(ta.value); var notes=applyVoice(o); o.notes=notes; VOICE.result=o; render();
      }}),
      h("button",{class:"vbtn ghost",text:"消す",onclick:function(){ VOICE.text=""; VOICE.result=null; render(); }})),
    SR?stat:h("p",{class:"hint",text:"キーボードのマイクボタンで話してから「読み取る」を押してください。"}),
    res);
}

function addDrug(id){
  var d=drug(id), dd=doseFor(d.ing,S.sp);
  S.items.push({id:id, si:0, mode:d.form==="fixed"?"fixed":"calc", dose:dd?dd.d:"", unit:dd?dd.u:"mg/kg", fixed:d.form==="fixed"?d.per5:""});
  refreshDrugs();
}

function drugCard(it, idx){
  var d=drug(it.id), r=calcItem(it), dd=doseFor(d.ing,S.sp);
  var card=h("div",{class:"drug"});
  card.appendChild(h("div",{class:"dh"},
    h("div",{class:"nm"},d.name,d.note?h("small",{text:d.note}):null),
    h("button",{class:"x",text:"✕","aria-label":"削除",onclick:function(){ S.items.splice(idx,1); refreshDrugs(); }})));
  // 規格・モード
  var mini=h("div",{class:"mini"});
  if(d.form!=="fixed"){
    d.str.forEach(function(s,i){ mini.appendChild(h("button",{class:it.si===i?"on":"",text:strLabel(d,s),onclick:function(){it.si=i;refreshDrugs();}})); });
    mini.appendChild(h("span",{style:"flex:1"}));
    [["calc","計算"],["fixed","量指定"]].forEach(function(m){
      mini.appendChild(h("button",{class:it.mode===m[0]?"on":"",text:m[1],onclick:function(){it.mode=m[0]; if(m[0]==="fixed"&&!num(it.fixed)) it.fixed=""; if(m[0]==="calc"&&!num(it.dose)){ it.dose=dd?dd.d:""; it.unit=dd?dd.u:"mg/kg"; } refreshDrugs();}}));
    });
  }
  card.appendChild(mini);

  if(it.mode==="fixed"){
    var unit = unitOf(d);
    var fin=h("input",{type:"text",inputmode:"decimal"}); fin.value=it.fixed;
    fin.addEventListener("input",function(){ fin.value=fin.value.replace(/[^\d.]/g,""); it.fixed=fin.value; updateResult(card,it); updateKarte(); });
    card.appendChild(h("div",{class:"inbox"+(num(it.fixed)?"":" req")},fin,h("span",{class:"u",text:unit+(S.prep==="pow"?"（全量）":" / 5mLあたり")})));
  }else{
    var din=h("input",{type:"text",inputmode:"decimal",placeholder:dd?"":"用量を入力"}); din.value=it.dose;
    var dbox=h("div",{class:"inbox"+(num(it.dose)?"":" req")},din,h("span",{class:"u",text:it.unit||"mg/kg"}));
    var um=h("div",{class:"mini",style:"margin:6px 0 0"});
    UNITS.forEach(function(u){ um.appendChild(h("button",{class:(it.unit||"mg/kg")===u?"on":"",text:u,onclick:function(){ it.unit=u; refreshDrugs(); }})); });
    din.addEventListener("input",function(){ din.value=din.value.replace(/[^\d.]/g,""); it.dose=din.value;
      dbox.className="inbox"+(num(it.dose)?"":" req"); updateResult(card,it); updateKarte(); });
    card.appendChild(dbox); card.appendChild(um);
    if(!S.sp) card.appendChild(h("div",{class:"caut",text:"動物種を選ぶと用量が自動で入ります"}));
    else if(dd){
      card.appendChild(h("div",{class:"ref"},
        h("b",{text:"用量表 "+rangeTxt(dd)+" "+dd.u+" "+(dd.f||"")}), badge(dd),
        h("div",{text:dd.src+(dd.note?"／"+dd.note:"")})));
    }else{
      card.appendChild(h("div",{class:"warn",text:spName(S.sp)+"の用量は未登録です。用量を手入力してください。"}));
    }
  }
  card.appendChild(h("div",{class:"slot"}));
  updateResult(card,it);
  return card;
}

function updateResult(card,it){
  var slot=card.querySelector(".slot"); slot.innerHTML="";
  var d=drug(it.id), r=calcItem(it), dd=doseFor(d.ing,S.sp);
  if(!r.ok){
    if(it.mode==="calc" && (it.unit||"mg/kg")==="mg/kg" && !(num(S.wt)&&+S.wt>0)) slot.appendChild(h("div",{class:"warn",text:"体重を入力してください"}));
    return;
  }
  if(S.prep==="pow"){
    var w=powWeight(r);
    slot.appendChild(h("div",{class:"res"},
      h("div",{class:"big",text:fmtQty(r.qty,r.unit)+" "+r.unit+(it.mode==="fixed"?"":"（"+packs()+"包分）")}),
      it.mode==="fixed"?null:h("div",{class:"sm",text:"薬剤量 "+fmtMg(r.mgTotal)+"mg ／ 1包 "+fmtMg(r.mgDose)+"mg（"+fmt(+it.dose,3)+(it.unit||"mg/kg")+"）"+(w!==null?" ／ 粉の重さ "+w.toFixed(3)+"g":"")})));
    if(w===null) slot.appendChild(h("div",{class:"caut",text:"この薬の重さが未登録です（薬剤マスタの「1個の重さ(mg)」）。ビオフェルミン量の計算に含まれていません。"}));
    if(dd && it.mode==="calc"){ var v2=+it.dose; if((it.unit||"mg/kg")!==dd.u) v2=NaN;
      if((dd.min!==null&&v2<dd.min)||(dd.max!==null&&v2>dd.max)) slot.appendChild(h("div",{class:"warn",text:"用量表の範囲（"+rangeTxt(dd)+dd.u+"）を外れています"}));
      if(dd.f && dd.f!==S.freq) slot.appendChild(h("div",{class:"caut",text:"用量表の回数は「"+dd.f+"」です（設定："+S.freq+"）"})); }
    return;
  }
  if(it.mode==="fixed"){
    slot.appendChild(h("div",{class:"res"},
      h("div",{class:"big",text:fmt(r.qty,2)+" "+r.unit}),
      h("div",{class:"sm",text:"全量"+S.total+"mLに対して（"+fmt(+it.fixed,2)+r.unit+"/5mL）"})));
    return;
  }
  var qtyTxt = fmtQty(r.qty,r.unit)+" "+r.unit;
  slot.appendChild(h("div",{class:"res"},
    h("div",{class:"big",text:qtyTxt+" を全量"+S.total+"mLに"}),
    h("div",{class:"sm",text:"薬剤量 "+fmtMg(r.mgTotal)+"mg ／ 1回 "+fmtMg(r.mgDose)+"mg（"+fmt(+it.dose,3)+(it.unit||"mg/kg")+"）／ 濃度 "+fmt(r.conc,3)+"mg/mL"})));
  if(dd){
    var v=+it.dose; if((it.unit||"mg/kg")!==dd.u) v=NaN;
    if((dd.min!==null&&v<dd.min)||(dd.max!==null&&v>dd.max)) slot.appendChild(h("div",{class:"warn",text:"用量表の範囲（"+rangeTxt(dd)+dd.u+"）を外れています"}));
    if(dd.f && dd.f!==S.freq) slot.appendChild(h("div",{class:"caut",text:"用量表の回数は「"+dd.f+"」です（設定："+S.freq+"）"}));
  }
}

function refreshDrugs(){
  var box=document.getElementById("drugs"); if(!box) return;
  box.innerHTML="";
  S.items.forEach(function(it,i){ box.appendChild(drugCard(it,i)); });
  updateKarte();
}

function updateKarte(){
  var box=document.getElementById("karte"); if(!box) return;
  box.innerHTML="";
  if(!S.items.length) return;
  var res=S.items.map(calcItem), v=vehicle(res);
  var card=h("div",{class:"card"},h("h2",{text:"カルテ転記"}));
  if(S.prep==="pow"){ var f=filler(res);
    if(!(packs()>0)) card.appendChild(h("div",{class:"warn",style:"margin:0 0 10px",text:"日数を入力してください"}));
    else if(f.bio<0) card.appendChild(h("div",{class:"warn",style:"margin:0 0 10px",text:"薬だけで1包"+S.pack+"gを超えています（合計"+f.sum.toFixed(2)+"g）。1包の重さを増やしてください。"}));
    else card.appendChild(h("div",{class:"caut",style:"margin:0 0 10px;color:var(--mint-d);background:var(--mint-l)",text:"粉の合計 "+f.total.toFixed(2)+"g（"+packs()+"包×"+S.pack+"g）＝ 薬 "+f.sum.toFixed(2)+"g ＋ ビオフェルミン末 "+f.bio.toFixed(2)+"g"}));
    if(f.unknown.length) card.appendChild(h("div",{class:"caut",style:"margin:0 0 10px",text:"重さ未登録："+f.unknown.join("・")+"（ビオフェルミン量に未反映）"}));
  }
  else if(v.rem<0) card.appendChild(h("div",{class:"warn",style:"margin:0 0 10px",text:"液剤だけで総液量を超えています（"+fmt(v.liq,2)+"mL）。総液量か1回量を見直してください。"}));
  var txt=karteText();
  card.appendChild(h("pre",{class:"karte",text:txt}));
  var msg=h("div",{class:"copied"});
  card.appendChild(h("button",{class:"copy",text:"カルテ用にコピー",onclick:function(){
    function done(){ msg.textContent="コピーしました。ARMIXに貼り付けてください。"; }
    try{ navigator.clipboard.writeText(txt).then(done,fallback); }catch(e){ fallback(); }
    function fallback(){ var ta=h("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); done(); }catch(e){ msg.textContent="コピーできませんでした。長押しで選択してください。"; } ta.remove(); }
  }}));
  card.appendChild(msg);
  box.appendChild(card);
}

/* ===== 画面：用量表 ===== */
function viewTable(){
  var w=h("div");
  w.appendChild(statusBar());
  w.appendChild(h("div",{class:"card"},
    h("h2",{text:"用量表"}),
    h("p",{class:"hint",style:"margin-top:0",text:"編集・追記はGoogleスプレッドシートで行います。確認者が空欄の行は「未確認」と表示されます。未登録の組み合わせは計算時に手入力です。"}),
    h("a",{href:SHEET_URL,target:"_blank",rel:"noopener",class:"open",text:"スプレッドシートを開いて編集"})));
  ING.forEach(function(ing){
    if(!DOSES[ing]) DOSES[ing]={};
    var drugsUsing=DRUGS.filter(function(d){return d.ing===ing;}).map(function(d){return d.name;}).join("・");
    var tb=h("table",{class:"dt"},h("tr",null,h("th",{text:"動物種"}),h("th",{text:"用量(mg/kg)"}),h("th",{text:"回数"}),h("th",{text:"出典・備考"})));
    SPECIES.forEach(function(s){
      var d=DOSES[ing][s.k];
      if(d) tb.appendChild(h("tr",null,h("td",{text:s.l}),h("td",{text:rangeTxt(d)+(d.min!==null||d.max!==null?"（"+d.d+"）":"")+(d.u!=="mg/kg"?" "+d.u:"")}),h("td",{text:d.f||"—"}),h("td",null,d.src+(d.note?"／"+d.note:""),h("div",null,badge(d)))));
      else tb.appendChild(h("tr",null,h("td",{text:s.l}),h("td",{class:"na",text:"未登録"}),h("td",{class:"na",text:""}),h("td",{class:"na",text:""})));
    });
    w.appendChild(h("div",{class:"card"},h("h2",{text:ing}),h("p",{class:"hint",style:"margin:-6px 0 8px",text:"対象：" + drugsUsing}),tb));
  });
  return w;
}

/* ===== ルーティング ===== */
document.getElementById("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;view=b.getAttribute("data-v");render();window.scrollTo(0,0);});
function render(){
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"),function(b){b.classList.toggle("on",b.getAttribute("data-v")===view);});
  var m=document.getElementById("main"); m.innerHTML="";
  m.appendChild(view==="calc"?viewCalc():viewTable());
}
render();
loadSheet();
})();
</script>
